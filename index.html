/* ---- 캘린더 ---- */
const DAYS=["일","월","화","수","목","금","토"];
function evDate(e){return new Date(e.start.dateTime||e.start.date+"T00:00:00");}
const GCOLOR={"1":"#7986cb","2":"#33b679","3":"#8e24aa","4":"#e67c73","5":"#f6bf26","6":"#f4511e","7":"#039be5","8":"#616161","9":"#3f51b5","10":"#0b8043","11":"#d50000"};
function evColor(e){return GCOLOR[e.colorId]||"#00d2be";}
function evEnd(e){return e.end?(e.end.dateTime?new Date(e.end.dateTime):new Date(e.end.date+"T00:00:00")):evDate(e);}
async function loadCalendar(){
  const now=new Date();
  const day0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const mStart=new Date(now.getFullYear(),now.getMonth(),1);      /* 이번 달 1일 */
  const mEnd=new Date(now.getFullYear(),now.getMonth()+2,1);      /* 다음 달 말일까지 */
  const d=await gfetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=100"
    +"&timeMin="+encodeURIComponent(mStart.toISOString())+"&timeMax="+encodeURIComponent(mEnd.toISOString()));
  const evs=(d.items||[]).filter(e=>e.status!=="cancelled");
  /* 이번 주 위젯 */
  const weekEnd=new Date(now); weekEnd.setDate(weekEnd.getDate()+7);
  const isWd=e=>["4","6","11"].includes(e.colorId)||(!e.colorId&&/\(\s*\d+(?:\.\d+)?\s*\)/.test(e.summary||""));
  const plain=evs.filter(e=>!isWd(e));
  /* 종일 이벤트 end.date는 exclusive — 끝난 다음날까지 살아남지 않게 경계 보정 */
  const evLive=e=>(e.end&&e.end.date)?evEnd(e)>day0:evEnd(e)>=day0;
  const realEnd=e=>{const x=evEnd(e); return (e.end&&e.end.date)?new Date(x.getTime()-86400000):x;};
  const spanLbl=(e,dd)=>{const re=realEnd(e);
    if(re.getFullYear()===dd.getFullYear()&&re.getMonth()===dd.getMonth()&&re.getDate()===dd.getDate())return null;
    return (dd.getMonth()+1)+"/"+dd.getDate()+"~"+(re.getMonth()===dd.getMonth()?"":(re.getMonth()+1)+"/")+re.getDate();};
  const week=plain.filter(e=>evDate(e)<weekEnd&&evLive(e));
  const next=plain.find(e=>evEnd(e)>=now);
  let html='';
  if(typeof wgMiniCal==="function")wgMiniCal();
  window.__nextEv=next?{summary:(next.summary||"(제목 없음)"), date:(function(){const x=evDate(next);const c=new Date(x);c.setHours(0,0,0,0);return c;})()}:null;
  if(typeof wgDday==="function")wgDday();
  if(next){
    const dd=evDate(next);
    const sp=spanLbl(next,dd);
    html+='<div class="ev-next"><div class="k">NEXT</div>'+esc(next.summary||"(제목 없음)")
      +' <span style="color:var(--sub2)">· '+(sp?sp+" ("+DAYS[dd.getDay()]+"~)":(dd.getMonth()+1)+"/"+dd.getDate()+" ("+DAYS[dd.getDay()]+")")+" "
      +(next.start.dateTime?String(dd.getHours()).padStart(2,"0")+":"+String(dd.getMinutes()).padStart(2,"0"):"종일")+'</span></div>';
  }
  let hsetW=new Set();
  try{
    hsetW=await ensureHoli(now.getFullYear(),now.getMonth());
    const we=new Date(now.getTime()+7*86400000);
    if(we.getMonth()!==now.getMonth()){const h2=await ensureHoli(we.getFullYear(),we.getMonth());h2.forEach(x=>hsetW.add(x));}
  }catch(e){}
  if(week.length){
    const today=new Date(); today.setHours(0,0,0,0);
    html+=week.slice(0,7).map(e=>{
      const dd=evDate(e); const re=realEnd(e); const sp=spanLbl(e,dd);
      const isToday=dd<new Date(today.getTime()+86400000)&&re>=today;   /* 진행 중 포함 */
      const lbl=sp?(isToday?"오늘 · "+sp:sp):(isToday?"오늘":(dd.getMonth()+1)+"/"+dd.getDate()+" "+DAYS[dd.getDay()]);
      return '<div class="ev"><span class="d'+(isToday?" today":" "+dayCls(dd,hsetW))+'">'+lbl+'</span>'
        +'<span class="t">'+esc(e.summary||"(제목 없음)")+'</span>'
        +(e.start.dateTime?'<span class="tm">'+String(dd.getHours()).padStart(2,"0")+":"+String(dd.getMinutes()).padStart(2,"0")+'</span>':"")
        +'</div>';
    }).join("");
  }else html+='<div class="w-empty">이번 주 일정 없음</div>';
  $("cal-body").innerHTML=html;
  /* 출금: 이번 달 / 다음 달 페이저 (주황 colorId 4·6·11 + 괄호 금액) */
  const WARM=["4","6","11"];
  const parseAmt=s=>{const m=(s||"").match(/\(\s*(\d+(?:\.\d+)?)\s*\)/)||(s||"").match(/(\d+(?:\.\d+)?)\s*만/);return m?Math.round(parseFloat(m[1])*10000):null;};
  const wdAll=evs.map(e=>{
    const warm=WARM.includes(e.colorId);
    const amt=parseAmt(e.summary);
    if(warm||(amt!=null&&!e.colorId))return {e,amt};
    return null;
  }).filter(Boolean);
  WD_PAGES=[0,1].map(off=>{
    const m0=new Date(now.getFullYear(),now.getMonth()+off,1);
    const m1=new Date(now.getFullYear(),now.getMonth()+off+1,1);
    const list=wdAll.filter(x=>{const dd=evDate(x.e);return dd>=m0&&dd<m1;});
    return {title:off?"다음 달 출금":"이번 달 출금", mon:(m0.getMonth()+1)+"월", list};
  });
  WD_PI=0; renderWd();
}

let WD_PAGES=null, WD_PI=0;
function renderWd(){
  if(!WD_PAGES)return;
  const pg=WD_PAGES[WD_PI];
  const today=new Date(); today.setHours(0,0,0,0);
  let wh='<div class="wt"><svg class="wic" viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="11" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6.2 12h.01M17.8 12h.01"/></svg> '
    +pg.title+' <span class="r"><button class="wnav" data-w="-1"'+(WD_PI===0?" disabled":"")+' aria-label="이전 달"><svg class="gl" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button> '+pg.mon+' <button class="wnav" data-w="1"'+(WD_PI===1?" disabled":"")+' aria-label="다음 달"><svg class="gl" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></span></div>';
  if(pg.list.length){
    const total=pg.list.reduce((s,x)=>s+(x.amt||0),0);
    wh+='<div class="wsc">';
    wh+=pg.list.map(x=>{
      const dd=evDate(x.e);
      const past=dd<today;
      const nm=esc((x.e.summary||"").replace(/\(\s*\d+(?:\.\d+)?\s*\)/,"").trim());
      return '<div class="wd'+(past?" wpast":"")+'"><span class="d">'+(dd.getMonth()+1)+"/"+dd.getDate()+" "+DAYS[dd.getDay()]+'</span>'
        +'<span class="t">'+nm+'</span><span class="a">'+(x.amt!=null?x.amt.toLocaleString()+"원":"—")+'</span></div>';
    }).join("");
    wh+='</div><div class="wd-sum">합계 <b>'+total.toLocaleString()+'원</b></div>';
  }else wh+='<div class="w-empty">'+pg.mon+' 출금 일정 없음 (캘린더에 "항목 N만" 형식)</div>';
  $("w-wd").innerHTML=wh;
  $("w-wd").querySelectorAll(".wnav").forEach(bn=>bn.onclick=e2=>{
    e2.stopPropagation();
    WD_PI=Math.max(0,Math.min(1,WD_PI+(+bn.dataset.w)));
    renderWd();
  });
}

/* ---- 시트 ---- */
let SHEET=null; /* {grid, monthCol, rows:{예산,잔여,소진율,지출금액}, catRows:{}} */
function monKey(){const d=new Date();return String(d.getFullYear()%100).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");}
function colA1(i){let s="";i++;while(i){s=String.fromCharCode(65+(i-1)%26)+s;i=Math.floor((i-1)/26);}return s;}
async function loadSheet(){
  const d=await gfetch("https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+"/values/Details!A1:U90?valueRenderOption=UNFORMATTED_VALUE");
  const g=d.values||[];
  const hdr=g[1]||[];
  const mk=monKey();
  let mc=-1;
  hdr.forEach((v,i)=>{if(String(v).trim()===mk)mc=i;});
  if(mc<0){$("money-body").innerHTML='<div class="w-empty">시트에 '+mk+' 월 컬럼이 없어요</div>';return;}
  const norm=s=>String(s||"").replace(/\s+/g,"");
  const find=lbl=>{const L=norm(lbl);for(let r=0;r<g.length;r++){if(norm((g[r]||[])[1])===L)return r;}return -1;};
  const rows={예산:find("예산"),잔여:find("잔여"),소진율:find("소진율"),지출금액:find("지출 금액"),지출가능:find("지출 가능"),
              저축금액:find("저축 금액"),보험:find("보험"),고정지출:find("고정 지출"),저축:find("저축")};
  /* 지출 카테고리·세부항목 행 매핑 */
  const catRows={}, targetRows={};
  for(let r=38;r<g.length;r++){
    const lbl=String((g[r]||[])[1]||"").trim();
    if(CATS.includes(lbl)&&catRows[lbl]===undefined)catRows[lbl]=r;
  }
  for(const c of CATTREE){
    const pr=catRows[c.cat]; if(pr===undefined)continue;
    if(!c.subs.length){targetRows[c.cat]=pr;continue;}
    for(const s of c.subs){
      for(let r=pr+1;r<Math.min(pr+9,g.length);r++){
        if(String((g[r]||[])[1]||"").trim()===s.n){targetRows[c.cat+">"+s.n]=r;break;}
      }
    }
  }
  SHEET={g,mc,rows,catRows,targetRows};
  const num=r=>{const v=r>=0?(g[r]||[])[mc]:null;return typeof v==="number"?v:(v&&!isNaN(+v)?+v:null);};
  const budget=num(rows.예산), spent=num(rows.지출금액), cap0=num(rows.지출가능),
        savePlan=num(rows.저축), remainRow=num(rows.잔여);
  /* 쓸 수 있는 돈 = 지출가능(36행) − 저축(6행). 36행엔 저축이 차감돼 있지 않음 */
  const cap=(cap0!=null)?(cap0-(savePlan||0))
           :((budget!=null)?budget-(num(rows.고정지출)||0)-(num(rows.보험)||0)-(savePlan||0):null);
  /* 남은 돈 = 시트 잔여(10행) 우선, 없으면 계산 */
  const left=(remainRow!=null)?remainRow:((cap!=null&&spent!=null)?cap-spent:null);
  const rate=(cap&&spent!=null)?spent/cap:null;
  const w=v=>v==null?"—":Math.round(v).toLocaleString();
  $("money-mon").textContent=mk;
  let html='<div class="mon-nums">'
    +'<div class="mn"><div class="k">쓸 수 있는 돈</div><div class="v" data-n="'+(cap!=null?Math.round(cap):"")+'">'+w(cap)+'</div></div>'
    +'<div class="mn"><div class="k">쓴 돈</div><div class="v" data-n="'+(spent!=null?Math.round(spent):"")+'">'+w(spent)+'</div></div>'
    +'<div class="mn"><div class="k">남은 돈</div><div class="v '+(left!=null&&left<0?"red":"lime")+'" data-n="'+(left!=null?Math.round(left):"")+'">'+w(left)+'</div></div>'
    +'</div>';
  if(rate!=null){
    const pct=Math.min(100,rate*100);
    html+='<div class="gauge"><div class="gb'+(pct>90?" warn":"")+'" style="width:'+pct+'%"></div></div>'
      +'<div class="glabel"><span>소진율</span><span>'+(rate*100).toFixed(1)+'%</span></div>';
  }
  /* 카테고리 바 */
  const cvs=CATS.map(c=>({c,v:(()=>{const v=(g[catRows[c]]||[])[mc];return typeof v==="number"?v:0;})()})).filter(x=>x.v>0);
  if(cvs.length){
    const mx=Math.max(...cvs.map(x=>x.v));
    html+='<div class="cats">'+cvs.sort((a,b)=>b.v-a.v).map(x=>
      '<div class="cat"><span class="cn">'+x.c+'</span><span class="cb"><i style="width:'+(x.v/mx*100)+'%"></i></span><span class="cv">'+Math.round(x.v).toLocaleString()+'</span></div>'
    ).join("")+'</div>';
  }
  /* 고정지출·보험·저축 */
  const fx=num(rows.고정지출), ins=num(rows.보험), sav=num(rows.저축);
  const mf=$("money-foot");
  const fxHtml='<div class="fxline">고정지출 <b>'+w(fx)+'</b><span>·</span>보험 <b>'+w(ins)+'</b><span>·</span>저축 <b>'+w(sav)+'</b></div>';
  if(mf){ mf.innerHTML=fxHtml; mf.classList.remove("hidden"); } else html+=fxHtml;
  $("money-body").innerHTML=html;
  animateNums($("money-body"));
}
/* 숫자 카운트업 */
function animateNums(root){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  root.querySelectorAll("[data-n]").forEach(el=>{
    const target=+el.dataset.n; if(!el.dataset.n||isNaN(target))return;
    const st=performance.now(), dur=650;
    const tick=t=>{
      const p=Math.min(1,(t-st)/dur), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*e).toLocaleString();
      if(p<1)requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}



/* ---- 캘린더 간편 입력 ---- */
function parseCalInput(s){
  s=s.trim(); if(!s)return null;
  const dm=s.match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  if(!dm)return null;
  const now=new Date();
  let y=now.getFullYear(), mo=+dm[1], da=+dm[2];
  const cand=new Date(y,mo-1,da);
  if(cand<new Date(now.getFullYear(),now.getMonth(),now.getDate()-30))y++;
  let rest=(s.slice(0,dm.index)+s.slice(dm.index+dm[0].length)).trim();
  let allDay=false, sh=null, sm=0, eh=null, em=0;
  if(/종일/.test(rest)){ allDay=true; rest=rest.replace(/종일/,"").trim(); }
  else{
    let tm=rest.match(/(\d{1,2})(?::(\d{2}))?\s*(?:시)?\s*[~\-]\s*(\d{1,2})(?::(\d{2}))?\s*시?/);
    if(tm){ sh=+tm[1]; sm=+(tm[2]||0); eh=+tm[3]; em=+(tm[4]||0); rest=(rest.slice(0,tm.index)+rest.slice(tm.index+tm[0].length)).trim(); }
    else{
      tm=rest.match(/(\d{1,2})(?::(\d{2}))?\s*시(\s*반)?/)||rest.match(/(\d{1,2}):(\d{2})/);
      if(tm){ sh=+tm[1]; sm=tm[3]?30:+(tm[2]||0); eh=sh+1; em=sm; rest=(rest.slice(0,tm.index)+rest.slice(tm.index+tm[0].length)).trim(); }
      else allDay=true;
    }
  }
  const title=rest.replace(/\s+/g," ").trim();
  if(!title)return null;
  return {y,mo,da,allDay,sh,sm,eh,em,title};
}
const p2=n=>String(n).padStart(2,"0");
function calPrevText(p){
  const d=p.y+"."+p2(p.mo)+"."+p2(p.da);
  return p.allDay?d+" · 종일":d+" · "+p2(p.sh)+":"+p2(p.sm)+"–"+p2(p.eh)+":"+p2(p.em);
}
$("c-in").addEventListener("input",()=>{
  const p=parseCalInput($("c-in").value);
  $("c-add").disabled=!p;
  const pv=$("c-prev");
  if(!p){pv.classList.add("hidden");return;}
  pv.classList.remove("hidden");

/* ---- 공휴일 (구글 대한민국 공휴일 캘린더) ---- */
const HOLI={};
async function ensureHoli(y,m){
  const key=y+"-"+m;
  if(HOLI[key])return HOLI[key];
  try{
    const t0=new Date(y,m,1), t1=new Date(y,m+1,1);
    const cid=encodeURIComponent("ko.south_korea#holiday@group.v.calendar.google.com");
    const d=await gfetch("https://www.googleapis.com/calendar/v3/calendars/"+cid+"/events?singleEvents=true"
      +"&timeMin="+encodeURIComponent(t0.toISOString())+"&timeMax="+encodeURIComponent(t1.toISOString()));
    HOLI[key]=new Set((d.items||[]).filter(e=>e.start&&e.start.date).map(e=>e.start.date));
  }catch(e){ HOLI[key]=new Set(); }
  return HOLI[key];
}
function dayCls(dd,hset){
  const iso=dd.getFullYear()+"-"+p2(dd.getMonth()+1)+"-"+p2(dd.getDate());
  if(dd.getDay()===6)return "dsat";
  if(dd.getDay()===0||(hset&&hset.has(iso)))return "dsun";
  return "";
}

let calCache={}, calMonth=new Date();
async function fetchMonth(y,m){
  const key=y+"-"+m;
  if(calCache[key])return calCache[key];
  const t0=new Date(y,m,1), t1=new Date(y,m+1,1);
  const d=await gfetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=250"
    +"&timeMin="+encodeURIComponent(t0.toISOString())+"&timeMax="+encodeURIComponent(t1.toISOString()));
  return calCache[key]=(d.items||[]).filter(e=>e.status!=="cancelled");
}
async function openCalDetail(){
  if(!gtoken()){connectGoogle();return;}
  const bg=modal('<h3><svg class="wic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg> 캘린더</h3><div id="det"></div><div class="m-row"><button class="mbtn" data-x>닫기</button></div>',
    b=>{b.querySelector("[data-x]").onclick=()=>b.remove(); b.querySelector(".modal").classList.add("wide");});
  const det=bg.querySelector("#det");
  async function draw(){
    const y=calMonth.getFullYear(), m=calMonth.getMonth();
    det.innerHTML='<div class="w-empty">불러오는 중…</div>';
    let evs=[]; try{evs=await fetchMonth(y,m);}catch(e){det.innerHTML='<div class="w-empty">불러오기 실패</div>';return;}
    const hset=await ensureHoli(y,m);
    const byDay={};
    evs.forEach(e=>{
      const s=e.start.dateTime?new Date(e.start.dateTime):new Date(e.start.date+"T00:00:00");
      let en=e.end?(e.end.dateTime?new Date(e.end.dateTime):new Date(e.end.date+"T00:00:00")):new Date(s.getTime()+1);
      const last=new Date(en.getTime()-1); /* 종료 경계 직전 = 마지막 포함일 */
      let d=new Date(s.getFullYear(),s.getMonth(),s.getDate());
      const stop=new Date(last.getFullYear(),last.getMonth(),last.getDate());
      let guard=0;
      while(d<=stop&&guard++<62){
        if(d.getFullYear()===y&&d.getMonth()===m)(byDay[d.getDate()]=byDay[d.getDate()]||[]).push(e);
        d.setDate(d.getDate()+1);
      }
    });
    const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
    const today=new Date();
    let cal='<div class="mnav"><button id="mprev" aria-label="이전 달"><svg class="gl" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><b>'+y+"."+p2(m+1)+'</b><button id="mnext" aria-label="다음 달"><svg class="gl" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>';
    cal+='<div class="mgrid">'+["일","월","화","수","목","금","토"].map((d,i)=>'<div class="mh'+(i===0?" dsun":(i===6?" dsat":""))+'">'+d+'</div>').join("");
    for(let i=0;i<first;i++)cal+='<div class="md off"></div>';
    for(let d=1;d<=days;d++){
      const isT=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
      const list=(byDay[d]||[]);
      const wcls=dayCls(new Date(y,m,d),hset);
      cal+='<div class="md'+(isT?" today":"")+(wcls?" bg-"+wcls:"")+'"><span class="dn2 '+wcls+'">'+d+'</span>'
        +list.slice(0,2).map(e=>{const c=evColor(e);return '<span class="me" style="background:'+hexA(c,.17)+';box-shadow:inset 2px 0 0 '+c+'">'+esc((e.summary||"").slice(0,7))+'</span>';}).join("")
        +(list.length>2?'<span class="me more">+'+(list.length-2)+'</span>':"")+'</div>';
    }
    cal+='</div>';
    /* 다가오는 일정 */
    const up=evs.filter(e=>evDate(e)>=today).slice(0,8);
    cal+='<div class="sec-label" style="margin-top:16px">다가오는 일정</div>'
      +(up.length?up.map(e=>{const dd=evDate(e);
        return '<div class="ev"><span class="d '+dayCls(dd,hset)+'">'+(dd.getMonth()+1)+"/"+dd.getDate()+" "+DAYS[dd.getDay()]+'</span><span class="edot" style="background:'+evColor(e)+'"></span><span class="t">'+esc(e.summary||"")+'</span>'
        +(e.start.dateTime?'<span class="tm">'+p2(dd.getHours())+":"+p2(dd.getMinutes())+'</span>':"")+'</div>';}).join("")
      :'<div class="w-empty">이번 달 남은 일정 없음</div>');
    det.innerHTML=cal;
    det.querySelector("#mprev").onclick=()=>{calMonth=new Date(y,m-1,1);draw();};
    det.querySelector("#mnext").onclick=()=>{calMonth=new Date(y,m+1,1);draw();};
  }
  calMonth=new Date(); draw();
}

  const num=(r,c)=>{const v=r>=0?(g[r]||[])[c]:null;return typeof v==="number"?v:(v&&!isNaN(+v)?+v:null);};
  const w=v=>v==null?"—":Math.round(v).toLocaleString();
  function drawTrend(){
    const R=SHEET.rows;
    const src=trendYear==="all"?months:months.filter(x=>x.k.split(".")[0]===trendYear);
    const pts=src.map(x=>{
      const c0=num(R.지출가능,x.c), sv=num(R.저축,x.c), sp=num(R.지출금액,x.c);
      return {k:x.k, c:x.c, cap:(c0!=null)?c0-(sv||0):null, sp, sav:sv};

    if(!pts.length){det.innerHTML+='<div class="w-empty">데이터 없음</div>';return "";}
    const W=620,H=230,PL=52,PR=12,PT=14,PB=30;
    const vals=pts.flatMap(p=>[p.cap,p.sp,p.sav]).filter(v=>v!=null);
    const max=Math.max(...vals)*1.08, min=0;
    const X=i=>PL+(W-PL-PR)*(pts.length===1?0.5:i/(pts.length-1));
    const Y=v=>PT+(H-PT-PB)*(1-(v-min)/(max-min));
    const nowIdx=pts.findIndex(p=>p.c===SHEET.mc);
    function line(getv,color){
      let solid="",dash="";
      pts.forEach((p,i)=>{
        const v=getv(p); if(v==null)return;

      });
      let s="";
      if(solid)s+='<polyline points="'+solid+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';

    }
    let sv='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';

    }
    pts.forEach((p,i)=>{
      if(trendYear==="all"&&pts.length>8&&i%2!==0)return;
      sv+='<text x="'+X(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="9.5" fill="rgba(235,245,243,.4)"'+(p.c===SHEET.mc?' font-weight="bold" fill="#00d2be"':"")+'>'+parseInt(p.k.split(".")[1])+'월</text>';
    });
    sv+=line(p=>p.cap,"#00d2be")+line(p=>p.sp,"#ff7a6b")+line(p=>p.sav,"#e6c592")+'</svg>';

      const ychips='<div class="chips mb">'
        +'<button class="chip'+(trendYear==="all"?" on":"")+'" data-ty="all">전체</button>'

    let m='<div class="chips mb">'
      +years.map(y=>'<button class="chip'+(y===selYear?" on":"")+'" data-y="'+y+'">20'+y+'</button>').join("")+'</div>';
    m+='<div class="chips">'
      +months.filter(x=>x.k.split(".")[0]===selYear)
             .map(x=>'<button class="chip'+(x.c===c?" on":"")+'" data-c="'+x.c+'">'+parseInt(x.k.split(".")[1])+'월</button>').join("")+'</div>';
    const R=SHEET.rows;
    m+='<div class="mon-nums mt">'
      +(function(){
        const c0=num(R.지출가능,c), sp=num(R.지출금액,c), sv=num(R.저축,c), rm=num(R.잔여,c);
        const cp=(c0!=null)?c0-(sv||0):null;
        const lf=(rm!=null)?rm:((cp!=null&&sp!=null)?cp-sp:null);
        return '<div class="mn"><div class="k">쓸 수 있는 돈</div><div class="v">'+w(cp)+'</div></div>'

          +'<div class="mn"><div class="k">남은 돈</div><div class="v">'+w(lf)+'</div></div>';
      })()+'</div>';
    m+='<div class="fxline flat">고정지출 <b>'+w(num(R.고정지출,c))+'</b><span>·</span>보험 <b>'+w(num(R.보험,c))+'</b><span>·</span>저축 <b>'+w(num(R.저축,c))+'</b></div>';
    m+='<div class="sec-label">카테고리 상세</div>';
    for(const ct of CATTREE){

      }
    }
    det.innerHTML=tabs+m;
    det.querySelectorAll(".chip[data-md]").forEach(b=>b.onclick=()=>{mode=b.dataset.md;draw();});
    det.querySelectorAll(".chip[data-c]").forEach(b=>b.onclick=()=>{sel=+b.dataset.c;draw();});

async function wgEvDays(y,m){
  try{
    if(!gtoken()||typeof fetchMonth!=="function")return new Set();
    const isWd=e=>["4","6","11"].includes(e.colorId)||(!e.colorId&&/\(\s*\d+(?:\.\d+)?\s*\)/.test(e.summary||""));
    const evs=(await fetchMonth(y,m)).filter(e=>!isWd(e)), s=new Set();
    evs.forEach(e=>{
      const st=e.start.dateTime?new Date(e.start.dateTime):new Date(e.start.date+"T00:00:00");
      let en=e.end?(e.end.dateTime?new Date(e.end.dateTime):new Date(e.end.date+"T00:00:00")):new Date(st.getTime()+1);
      const last=new Date(en.getTime()-1);
      let d=new Date(st.getFullYear(),st.getMonth(),st.getDate());
      while(d<=last){ if(d.getMonth()===m&&d.getFullYear()===y)s.add(d.getDate()); d.setDate(d.getDate()+1); }
    });
    return s;
  }catch(e){ return new Set(); }
}

/* ---- 빠른 입력 ---- */
let Q={amt:null,desc:"",cat:null,type:"지출"};
function qParse(s){
  s=s.trim(); if(!s)return null;
  let date=null;
  const dm=s.match(/^(\d{1,2})[\/.](\d{1,2})(?=\s)/);
  if(dm){
    const now=new Date(); const mo=+dm[1]-1, da=+dm[2];
    let d=new Date(now.getFullYear(),mo,da);
    if(d.getTime()<now.getTime()-180*86400000)d=new Date(now.getFullYear()+1,mo,da);
    if(d.getMonth()===mo){ date=d; s=s.slice(dm[0].length).trim(); }
  }
  let inst=1;
  const im=s.match(/(\d{1,2})\s*(?:개월|회\s*할부|할부)/);
  if(im){ const n=+im[1]; if(n>=2&&n<=36){ inst=n; s=(s.slice(0,im.index)+s.slice(im.index+im[0].length)).trim(); } }
  let type=/수입/.test(s)?"수입":"지출";
  s=s.replace(/수입|지출/g,"").trim();
  const ms=[...s.matchAll(/(-?\d[\d,]*(?:\.\d+)?)\s*(만)?\s*원?/g)];
  if(!ms.length)return null;
  const m=ms[ms.length-1];
  let amt=parseFloat(m[1].replace(/,/g,""));
  if(m[2])amt*=10000;
  const desc=(s.slice(0,m.index)+s.slice(m.index+m[0].length)).replace(/\s+/g," ").trim()||"기타";
  const cat=type==="지출"?guessTarget(desc):null;
  return {amt:Math.round(amt),desc,cat,type,date,inst};
}
const INST_OPTS=[1,2,3,4,5,6,9,12,18,24,36];

$("q-save").onclick=qSave;
async function qSave(){
  const p=qParse($("q-in").value); if(!p)return;
  if(Math.abs(p.amt)>=10000000&&!confirm(p.amt.toLocaleString()+"원 — 금액이 맞나요?"))return;
  if(Q.type)p.type=Q.type;
  if(p.inst<=1&&Q.inst>1)p.inst=Q.inst;
  const sel=$("q-cat"); if(sel&&sel.value)p.cat=sel.value;
  if(p.type==="지출"&&!p.cat){toast("항목을 골라주세요");return;}
  if(!gtoken()){toast("구글 데이터 연결이 필요해요");return;}
  $("q-save").disabled=true;
  try{
    const d0=p.date||new Date();
    const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    /* 회차 전개 (단건이면 1개) — 말일 보정 + 마지막 회차 잔차 보정 */
    const insts=[];
    if(p.inst>1){
      const per=Math.round(p.amt/p.inst);
      for(let i=0;i<p.inst;i++){
        let d=new Date(d0.getFullYear(),d0.getMonth()+i,d0.getDate());
        if(d.getMonth()!==((d0.getMonth()+i)%12))d=new Date(d0.getFullYear(),d0.getMonth()+i+1,0);
        insts.push({d,desc:p.desc+" ("+(i+1)+"/"+p.inst+")",amt:i===p.inst-1?p.amt-per*(p.inst-1):per});
      }
      const lb=insts[0], le=insts[insts.length-1];
      if(!confirm(Math.round(p.amt/p.inst).toLocaleString()+"원 × "+p.inst+"회 ("
        +(lb.d.getMonth()+1)+"/"+lb.d.getDate()+" → "+(le.d.getMonth()+1)+"/"+le.d.getDate()
        +") · 총 "+p.amt.toLocaleString()+"원 — 할부로 기록할까?")){ $("q-save").disabled=false; return; }
    }else insts.push({d:d0,desc:p.desc,amt:p.amt});
    /* 이번 달 회차만 예산(Details)에 가산 */
    const nowM=new Date();
    const dAmt=insts.filter(x=>x.d.getFullYear()===nowM.getFullYear()&&x.d.getMonth()===nowM.getMonth()).reduce((s,x)=>s+x.amt,0);
    /* 1) 입력로그 append (탭 없으면 생성 후 재시도) */
    const row=insts.map(x=>[fmt(x.d),x.desc,x.amt,p.cat||"",p.type]);
    const appendURL="https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+"/values/"+encodeURIComponent("입력로그!A:E")+":append?valueInputOption=USER_ENTERED";
    try{
      await gfetch(appendURL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({values:row})});
    }catch(e){
      if(String(e.message).indexOf("api-400")>=0){
        await gfetch("https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+":batchUpdate",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({requests:[{addSheet:{properties:{title:"입력로그"}}}]})});
        await gfetch(appendURL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({values:[["날짜","내용","금액","카테고리","구분"],...row]})});
      }else throw e;
    }
    /* 2) 지출이면 이번 달 회차분만 Details 카테고리 셀 가산 */
    if(p.type==="지출"&&dAmt!==0){
      if(!SHEET)await loadSheet();
      const r=SHEET.targetRows[p.cat];
      if(r!==undefined){
        const a1="Details!"+colA1(SHEET.mc)+(r+1);
        /* 수식이면 "+금액"을 이어붙여 내역 보존, 숫자면 합산, 비었으면 새로 */
        const cur=await gfetch("https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+"/values/"+encodeURIComponent(a1)+"?valueRenderOption=FORMULA");
        const raw=cur.values&&cur.values[0]?cur.values[0][0]:"";
        let nv;
        if(typeof raw==="string"&&raw.trim().startsWith("="))nv=raw+(dAmt<0?"":"+")+dAmt;
        else if(typeof raw==="number")nv=raw+dAmt;
        else if(raw!==""&&!isNaN(+raw))nv=(+raw)+dAmt;
        else nv=dAmt;
        await gfetch("https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+"/values/"+encodeURIComponent(a1)+"?valueInputOption=USER_ENTERED",
          {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({values:[[nv]]})});
      }
    }
    toast(p.inst>1?("할부 "+p.inst+"회차 기록 완료 · 총 "+p.amt.toLocaleString()+"원"):((p.type==="지출"?"지출":"수입")+" "+p.amt.toLocaleString()+"원 기록됨"));
    $("q-in").value=""; $("q-prev").classList.add("hidden"); Q={amt:null};
    dashLoaded=0; loadSheet().catch(()=>{});
  }catch(e){ toast("저장 실패: "+e.message); }
  $("q-save").disabled=false;
}

</script>
</body>
</html>
