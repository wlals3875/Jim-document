<style>
  :root{
    --bg:#0a0b0c; --bg2:#0d0f10;
    --card:#121416; --card2:#16191b; --line:#24282b; --line2:#323639;
    --ink:#eef1f3; --sub:#9aa3a9; --sub2:#6d757b;
    --lime:#00d2be; --lime-d:#00a89a; --mint:#8be9e0; --red:#f27a6a;
    --glow:0 0 0 1px rgba(0,210,190,.55), 0 0 22px rgba(0,210,190,.18);
    --grad:linear-gradient(115deg,#b8f24b,#00d2be 55%,#00a3d9);
    --grad-bar:linear-gradient(90deg,#b8f24b,#00d2be 55%,#38b6df);
    --glow-soft:0 0 0 1px rgba(0,210,190,.28), 0 0 14px rgba(0,210,190,.10);
  }
  *{box-sizing:border-box; margin:0; padding:0; scrollbar-width:thin; scrollbar-color:#323639 transparent;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2b2f33; border-radius:999px; border:2px solid transparent; background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:#3a4147; border:2px solid transparent; background-clip:padding-box;}
  html,body{overflow-x:hidden; max-width:100vw;}
  body{
    font-family:'Google Sans Flex','Wanted Sans Variable','Wanted Sans','Pretendard Variable',Pretendard,
      -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:
      radial-gradient(ellipse 70% 40% at 50% -5%, rgba(0,210,190,.06), transparent 60%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg) 30%);
    background-color:var(--bg);
    color:var(--ink); line-height:1.6; min-height:100vh;
    word-break:keep-all; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit; color:var(--ink);}
  ::placeholder{color:var(--sub2);}
  a{color:var(--lime);}

  /* ===== 로그인 게이트 ===== */
  #gate{
    position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
  }
  .gate-box{text-align:center; padding:20px;}
  .gmark{display:flex; justify-content:center; margin:16px 0 9px;}
  .gmark svg{width:56px; height:56px; filter:drop-shadow(0 0 14px rgba(0,210,190,.45)) drop-shadow(0 0 30px rgba(0,210,190,.2));}
  .gate-box .eyebrow{font-size:12px; font-weight:800; letter-spacing:.34em; color:var(--lime); text-transform:uppercase; margin-bottom:12px;}
  .gate-box h1{font-size:34px; font-weight:900; letter-spacing:-.02em; margin-bottom:8px;}
  .gate-box h1 .hl{background:linear-gradient(92deg,#dfe5e8 8%,var(--lime) 92%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .gate-box p{font-size:13.5px; color:var(--sub); margin-bottom:26px;}
  .gbtn{
    display:inline-flex; align-items:center; gap:10px; cursor:pointer;
    background:var(--card2); border:1px solid var(--line2); border-radius:14px;
    color:var(--ink); font-size:14.5px; font-weight:800; padding:13px 26px;
    transition:border-color .2s, box-shadow .2s;
  }
  .gbtn:hover{border-color:rgba(0,210,190,.5); box-shadow:var(--glow-soft);}
  .gbtn svg{width:19px; height:19px;}
  .gate-note{margin-top:16px; font-size:11.5px; color:var(--sub2);}

  /* ===== 상단 바 ===== */
  header::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:
      linear-gradient(90deg, transparent, rgba(0,210,190,.85) 42%, #8be9e0 50%, rgba(0,210,190,.85) 58%, transparent),
      linear-gradient(90deg, rgba(184,242,75,.26), rgba(0,210,190,.2) 55%, rgba(0,163,217,.12));
    background-size:240px 100%, 100% 100%;
    background-repeat:no-repeat, no-repeat;
    box-shadow:0 0 10px rgba(0,210,190,.25);
    background-position:-240px 0, 0 0;
  }
  header.loading::after{animation:sweep 1.6s linear infinite;}
  @keyframes sweep{
    from{background-position:-240px 0, 0 0;}
    to{background-position:calc(100% + 240px) 0, 0 0;}
  }
  header{
    position:sticky; top:0; z-index:60;
    background:rgba(10,11,12,.88); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .hbar{
    max-width:1060px; margin:0 auto; padding:calc(13px + env(safe-area-inset-top, 0px)) 18px 13px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .logo{
    font-size:20px; font-weight:900; letter-spacing:-.02em; color:var(--ink); cursor:pointer;
    white-space:nowrap; position:relative; display:flex; align-items:center;
  }
  .lmark{width:24px; height:24px; margin-right:6px; flex-shrink:0;
    filter:drop-shadow(0 0 10px rgba(0,210,190,.5)) drop-shadow(0 0 22px rgba(0,210,190,.25));}
  .logo .lt{text-shadow:0 0 16px rgba(0,210,190,.35), 0 0 34px rgba(0,210,190,.18);}
  .logo .s-mark{text-shadow:0 0 14px rgba(0,210,190,.65);}
  @keyframes logopulse{0%,100%{opacity:1}50%{opacity:.55}}
  .s-mark{
    background:var(--grad);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-size:1.22em; font-weight:900; line-height:1; display:inline-block; margin:0 .015em; transform:translateY(1px);
    animation:sflow 3.5s ease-in-out infinite;
  }
  @keyframes sflow{0%,100%{filter:hue-rotate(-22deg) saturate(1.05)}50%{filter:hue-rotate(24deg)}}
  .hsearch{
    flex:1; min-width:100px; display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 15px;
  }
  .hsearch input{flex:1; background:none; border:none; outline:none; font-size:13px; min-width:0;}
  .hsearch .hs-i{color:var(--sub2); font-size:13px;}
  .hsel{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    font-size:12px; font-weight:700; color:var(--sub); padding:0 12px; height:33px; outline:none; cursor:pointer;
  }
  .hbtn{
    background:var(--card); border:1px solid var(--line); border-radius:999px; cursor:pointer;
    font-size:12px; font-weight:800; color:var(--sub); padding:0 14px; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:33px;
    transition:color .15s, border-color .15s;
  }
  .hbtn:hover{color:var(--lime); border-color:rgba(0,210,190,.4);}
  .avatar{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line2); cursor:pointer; display:block;}
  .who{display:flex; align-items:center; gap:8px;}
  .who .un{font-size:12.5px; font-weight:800; color:var(--sub); max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .role{font-size:10px; font-weight:800; letter-spacing:.08em; padding:0 10px; height:21px;
    display:inline-flex; align-items:center; border-radius:999px; white-space:nowrap;}
  .role.master{color:var(--lime); border:1px solid rgba(0,210,190,.45); background:rgba(0,210,190,.08); box-shadow:var(--glow-soft);}
  .role.guest{color:var(--sub); border:1px solid var(--line2); background:var(--card2);}
  #mem-list .wd{align-items:center; gap:4px;}
  #mem-list .t{overflow:hidden; display:flex; align-items:center; gap:9px; white-space:normal; min-width:0;}
  #mem-list .t span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  #mem-list .role{flex-shrink:0;}
  #mem-list .c-del{margin-left:0; padding:4px 8px; flex-shrink:0;}
  #mem-list .c-del[data-e]{margin-left:auto;}
  .reqn{
    display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px;
    border-radius:999px; background:var(--grad); color:#021413; font-size:10px; font-weight:900; padding:0 5px; margin-left:5px;
  }
  .cpick{display:flex; gap:8px; flex-wrap:wrap; margin-top:2px;}
  .cdot{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; padding:0;}
  .cdot.on{border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.2);}
  .role.vip{color:#ff9ec7; border:1px solid rgba(255,158,199,.5); background:rgba(255,158,199,.08); box-shadow:0 0 0 1px rgba(255,158,199,.2), 0 0 12px rgba(255,158,199,.12);}
  @media(max-width:520px){ .who .un{display:none;} }

  /* ===== 레이아웃: 사이드바 + 본문 ===== */
  .layout{max-width:1180px; margin:0 auto; display:flex; align-items:flex-start;}
  aside{
    width:230px; flex-shrink:0; position:sticky; top:57px; z-index:1;
    height:calc(100vh - 57px); overflow-y:auto; padding:20px 10px 30px 18px;
    border-right:1px solid var(--line);
  }
  .s-label{font-size:10.5px; font-weight:800; letter-spacing:.14em; color:var(--sub2); margin:16px 8px 8px;}
  .s-item{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:none; border:none; cursor:pointer; border-radius:10px;
    font-size:13px; font-weight:700; color:var(--sub); padding:7.5px 10px;
    transition:background .15s, color .15s;
  }
  .s-item:hover{background:rgba(0,210,190,.07); color:var(--ink);}
  .s-item.on{background:rgba(0,210,190,.1); color:var(--lime);}
  .s-item .ic{width:18px; height:16px; flex-shrink:0; display:inline-flex; align-items:center;}
  .s-item .ic svg{width:16px; height:16px;}
  .s-item .tx{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .s-empty{font-size:12px; color:var(--sub2); padding:4px 10px;}
  .stor{margin:22px 8px 0; padding:13px 13px 12px; background:var(--card); border:1px solid var(--line); border-radius:11px;}
  .stor .st-t{display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:var(--sub); margin-bottom:8px;}
  .stor .st-t b{color:var(--ink); font-variant-numeric:tabular-nums;}
  .stor .st-track{height:5px; background:rgba(255,255,255,.07); border-radius:999px; overflow:hidden;}
  .stor .st-bar{height:100%; width:0; border-radius:999px; background:var(--grad-bar); transition:width .5s;}
  .stor .st-s{font-size:10.5px; color:var(--sub2); margin-top:7px; text-align:right; font-variant-numeric:tabular-nums;}
  body.side-off aside{display:none;}
  main{flex:1; min-width:0; position:relative; z-index:1; padding:22px 18px calc(90px + env(safe-area-inset-bottom, 0px));}
  @media(max-width:860px){
    aside{
      position:fixed; left:0; top:0; bottom:0; z-index:120; height:100vh;
      background:var(--bg2); border-right:1px solid var(--line2);
      transform:translateX(-105%); transition:transform .22s ease;
      padding-top:calc(24px + env(safe-area-inset-top, 0px));
      padding-bottom:env(safe-area-inset-bottom, 0px);
      box-shadow:20px 0 60px rgba(0,0,0,.45); width:250px;
    }
    aside.open{transform:translateX(0);}
    #aside-bg{position:fixed; inset:0; z-index:115; background:rgba(3,4,4,.62);}
    /* 앱형 헤더: 1행 메뉴·로고·뱃지·아바타 / 2행 검색 */
    .hbar{
      display:grid; column-gap:9px; row-gap:10px; align-items:center;
      grid-template-columns:auto auto 1fr auto auto;
      grid-template-areas:"m l . r w" "s s s s s";
      padding-left:12px; padding-right:12px;
    }
    #menu-btn{grid-area:m;}
    .logo{grid-area:l; justify-self:start; font-size:17.5px;}
    .lmark{width:21px; height:21px; margin-right:5px;}
    #role{grid-area:r; justify-self:end;}
    .who{grid-area:w;}
    .hsearch{grid-area:s; width:100%;}
    #stats-btn{display:none !important;}
    .who #uname{display:none;}
  }
  .crumb{display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:13px; margin-bottom:16px; min-height:24px;}
  .crumb a{color:var(--sub); text-decoration:none; font-weight:700;}
  .crumb a:hover{color:var(--lime);}
  .crumb .sep{color:var(--sub2);}
  .crumb .cur{color:var(--ink); font-weight:800;}
  .crumb .vis{
    font-size:10.5px; font-weight:800; letter-spacing:.05em; padding:2.5px 10px; border-radius:999px; margin-left:4px;
  }
  .vis.pub{color:var(--lime); border:1px solid rgba(0,210,190,.4); background:rgba(0,210,190,.07);}
  .vis.priv{color:var(--gold,#c9ced4); border:1px solid rgba(201,206,212,.4); background:rgba(201,206,212,.07); color:#c9ced4;}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:18px;}
  .tbtn{
    background:var(--card); border:1px solid var(--line); border-radius:999px; cursor:pointer;
    font-size:12.5px; font-weight:800; color:var(--sub); padding:9px 18px;
    transition:color .15s, border-color .15s, box-shadow .15s;
  }
  .tbtn:hover{color:var(--lime); border-color:rgba(0,210,190,.4); box-shadow:var(--glow-soft);}
  .tbtn.warn:hover{color:var(--red); border-color:rgba(242,122,106,.4); box-shadow:none;}

  .drop{
    border:1.5px dashed var(--line2); border-radius:11px; padding:22px; text-align:center;
    font-size:13px; color:var(--sub2); margin-bottom:20px; transition:border-color .2s, background .2s;
  }
  .drop.over{border-color:var(--lime); background:rgba(0,210,190,.05); color:var(--lime);}
  .drop b{color:var(--sub);}

  .sec-label{font-size:12px; font-weight:800; letter-spacing:.12em; color:var(--sub2); margin:6px 2px 10px; text-transform:uppercase;}
  .sec-label::before{
    content:""; display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:8px;
    background:linear-gradient(135deg,#b8f24b,#00d2be 55%,#0077b6);
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-bottom:26px;}

  .fcard,.dcard{
    background:var(--card); border:1px solid var(--line); border-radius:11px; padding:15px 16px;
    cursor:pointer; position:relative;
    transition:border-color .18s, box-shadow .18s, transform .18s;
  }
  .fcard:hover,.dcard:hover{border-color:rgba(0,210,190,.42); box-shadow:var(--glow-soft); transform:translateY(-2px);}
  .fcard .fi{margin-bottom:7px; display:block; height:20px;}
  .fcard .nm,.dcard .nm{font-size:14.5px; font-weight:800; line-height:1.45; padding-right:26px;}
  .dcard .nm .pin{color:var(--lime); font-size:12px; margin-right:4px;}
  .fcard .meta,.dcard .meta{font-size:11.5px; color:var(--sub2); margin-top:5px;}
  .dcard .desc{font-size:12px; color:var(--sub); margin-top:6px; line-height:1.55;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .dcard .tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px;}
  .dcard .tag{font-size:10px; font-weight:800; color:var(--mint); border:1px solid rgba(139,233,224,.35); padding:2px 8px; border-radius:999px;}
  .kebab{
    position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:8px;
    background:none; border:none; color:var(--sub2); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; line-height:1;
  }
  .kebab:hover{color:var(--lime); background:rgba(0,210,190,.08);}
  .empty-msg{
    border:1px dashed var(--line2); border-radius:16px; padding:30px; text-align:center;
    font-size:13px; color:var(--sub2); margin-bottom:26px;
  }

  /* ===== 메뉴 팝업 ===== */
  .menu{
    position:fixed; z-index:100; min-width:170px;
    background:var(--card2); border:1px solid var(--line2); border-radius:10px; overflow:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,.5);
  }
  .menu button{
    display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
    font-size:13px; font-weight:700; color:var(--sub); padding:10px 16px;
  }
  .menu button:hover{background:rgba(0,210,190,.08); color:var(--lime);}
  .menu button.warn:hover{background:rgba(242,122,106,.08); color:var(--red);}
  .menu .div{height:1px; background:var(--line);}

  /* ===== 모달 ===== */
  .modal-bg{position:fixed; inset:0; z-index:110; background:rgba(3,4,4,.74); display:flex; align-items:center; justify-content:center; padding:18px;}
  .modal{
    width:100%; max-width:440px; background:var(--card); border:1px solid var(--line2);
    border-radius:13px; padding:22px;
  }
  .modal{position:relative;}
  .m-x{
    position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:10px;
    background:var(--card2); border:1px solid var(--line2); color:var(--sub); cursor:pointer;
    font-size:13px; display:flex; align-items:center; justify-content:center; z-index:2;
  }
  .m-x:hover{color:var(--lime); border-color:rgba(0,210,190,.4);}
  .modal h3{font-size:16px; font-weight:900; margin-bottom:14px; padding-right:36px;}
  .modal label{display:block; font-size:11.5px; font-weight:800; color:var(--sub2); margin:12px 0 5px; letter-spacing:.04em;}
  .modal input[type=text],.modal textarea{
    width:100%; background:var(--card2); border:1px solid var(--line2); border-radius:11px;
    padding:10px 13px; font-size:13.5px; outline:none;
  }
  .modal input:focus,.modal textarea:focus{border-color:rgba(0,210,190,.5);}
  .modal textarea{resize:vertical; min-height:64px;}
  .m-row{display:flex; gap:9px; margin-top:18px; justify-content:flex-end;}
  .mbtn{
    border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    gap:6px; font-size:13px; font-weight:800; padding:0 20px; height:38px; line-height:1;
    background:var(--card2); border:1px solid var(--line2); color:var(--sub); box-sizing:border-box;
  }
  .mbtn.pri{background:var(--grad); border:none; color:#021413; font-weight:900;}
  .mbtn.pri:hover{box-shadow:var(--glow-soft);}
  .m-check{display:flex; align-items:center; gap:9px; margin-top:14px; font-size:13px; color:var(--sub); cursor:pointer;}
  .m-check input{width:17px; height:17px; accent-color:var(--lime);}

  /* ===== 뷰어 ===== */
  #viewer{position:fixed; inset:0; z-index:90; background:var(--bg); display:flex; flex-direction:column;}
  .v-bar{
    display:flex; align-items:center; gap:10px; padding:calc(11px + env(safe-area-inset-top, 0px)) 16px 11px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .v-bar .nm{font-size:14.5px; font-weight:800; flex:1; min-width:120px;}
  .v-meta{font-size:11.5px; color:var(--sub2); white-space:nowrap;}
  .v-frame{flex:1; border:none; width:100%; background:#fff;}
  .v-side{border-top:1px solid var(--line); background:var(--bg2); padding-bottom:env(safe-area-inset-bottom, 0px);}
  #c-toggle{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:none; border:none; cursor:pointer;
    font-size:12.5px; font-weight:800; color:var(--sub); padding:11px 18px;
  }
  #c-toggle .arr{margin-left:auto; color:var(--sub2); transition:transform .18s;}
  .v-side.closed #c-toggle .arr{transform:rotate(-90deg);}
  #c-wrap{max-height:34vh; overflow:auto; padding:0 18px 16px;}
  .v-side.closed #c-wrap{display:none;}
  .c-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .c-item img{width:26px; height:26px; border-radius:50%; flex-shrink:0;}
  .c-item .cn{font-weight:800; font-size:12.5px;}
  .c-item .ct{color:var(--sub); margin-top:1px;}
  .c-item .cd{font-size:10.5px; color:var(--sub2); margin-top:2px;}
  .c-del{background:none; border:none; color:var(--sub2); cursor:pointer; font-size:11px; margin-left:auto;
    display:inline-flex; align-items:center; padding:4px 6px;}
  .c-del:hover{color:var(--red);}
  .c-form{display:flex; gap:8px; margin-top:12px;}
  .c-form input{
    flex:1; background:var(--card); border:1px solid var(--line2); border-radius:999px;
    padding:9px 16px; font-size:13px; outline:none;
  }
  .c-form input:focus{border-color:rgba(0,210,190,.5);}

  /* ===== 통계 ===== */
  .chart{display:flex; align-items:flex-end; gap:4px; height:110px; margin:14px 0 6px;}
  .chart .bar{
    flex:1; background:linear-gradient(180deg,var(--lime),var(--lime-d)); border-radius:4px 4px 0 0;
    min-height:2px; position:relative;
  }
  .chart .bar span{
    position:absolute; top:-17px; left:50%; transform:translateX(-50%);
    font-size:9.5px; color:var(--sub2); font-weight:700;
  }
  .chart-x{display:flex; gap:4px; font-size:9px; color:var(--sub2); text-align:center;}
  .chart-x div{flex:1;}
  .visit-list{margin-top:16px; max-height:200px; overflow:auto;}
  .visit-list .vi{display:flex; gap:9px; font-size:12px; color:var(--sub); padding:6px 0; border-bottom:1px solid var(--line);}
  .visit-list .vi b{color:var(--ink);}
  .visit-list .vi .t{margin-left:auto; color:var(--sub2); font-size:11px; white-space:nowrap;}

  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:150;
    background:var(--card2); border:1px solid rgba(0,210,190,.4); color:var(--ink);
    font-size:13px; font-weight:700; padding:11px 20px; border-radius:999px;
    box-shadow:var(--glow-soft); opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #toast.show{opacity:1;}

  /* ===== 홈 대시보드 ===== */
  .dash{display:flex; flex-direction:column; gap:16px;}
  .qadd{
    display:flex; gap:9px; align-items:center;
    background:var(--card2); border:1px solid var(--line2); border-radius:12px; padding:7px 9px; margin-bottom:10px;
  }
  .qprev{margin-bottom:11px;}
  .qadd input{flex:1; background:none; border:none; outline:none; font-size:14px; min-width:0; padding:6px 4px;}
  .qadd .qbtn{
    background:var(--grad); border:none; color:#021413; font-weight:800; font-size:13px;
    padding:9px 18px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .qadd .qbtn:disabled{opacity:.45; cursor:default;}
  .qprev{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:2px 4px 0;
    font-size:12.5px; color:var(--sub);
  }
  .qprev .amt{font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums;}
  .qprev select{
    background:var(--card2); border:1px solid var(--line2); border-radius:999px;
    color:var(--lime); font-size:12px; font-weight:700; padding:4px 10px; outline:none;
  }
  .qprev .tsel{display:flex; gap:5px;}
  .qprev .tsel button{
    background:var(--card2); border:1px solid var(--line2); border-radius:999px; cursor:pointer;
    color:var(--sub); font-size:11.5px; font-weight:800; padding:4px 12px;
  }
  .qprev .tsel button.on{color:#021413; background:var(--lime); border-color:var(--lime);}
  .wgrid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .widget{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 19px;
    min-height:120px;
  }
  .widget .wt{
    display:flex; align-items:center; gap:9px; font-size:13px; font-weight:800;
    letter-spacing:.1em; color:var(--sub2); text-transform:uppercase; margin-bottom:13px;
  }
  .widget .wt .r{margin-left:auto; letter-spacing:0; text-transform:none; font-size:11.5px; font-weight:700;}
  .w-empty{font-size:12.5px; color:var(--sub2); padding:8px 0;}
  .connect-btn{
    background:var(--grad); border:none; color:#021413; font-weight:800; font-size:12.5px;
    padding:8px 16px; border-radius:999px; cursor:pointer;
  }
  /* 캘린더 */
  .ev{display:flex; gap:11px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; align-items:baseline;}
  .ev:last-child{border-bottom:none;}
  .ev .d{width:64px; flex-shrink:0; color:var(--sub2); font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums;}
  .ev .d.today{color:var(--lime);}
  .ev .t{flex:1; color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ev .tm{color:var(--sub2); font-size:11.5px; font-variant-numeric:tabular-nums;}
  .wic{width:1.06em; height:1.06em; stroke:url(#wgi); fill:none; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.16em; flex-shrink:0;}
  .wt .wic{align-self:center; width:1.15em; height:1.15em;}
  .s-item .wic{width:1.1em; height:1.1em;}
  .edot{width:8px; height:8px; border-radius:50%; flex-shrink:0; align-self:center;}
  .hbtn:hover,.mbtn:hover,.qbtn:hover,.connect-btn:hover,.chip:hover,.navbtn:hover,.c-del:hover,.kebab:hover{
    box-shadow:0 0 0 1px rgba(0,210,190,.4), 0 0 13px rgba(0,210,190,.2);
  }
  /* 활성 요소 숨쉬는 글로우 */
  @keyframes actglow{
    0%,100%{box-shadow:0 0 0 1px rgba(var(--g,0,210,190),.32), 0 0 9px rgba(var(--g,0,210,190),.1);}
    50%{box-shadow:0 0 0 1px rgba(var(--g,0,210,190),.62), 0 0 22px rgba(var(--g,0,210,190),.3);}
  }
  .role.master{animation:actglow 3.6s ease-in-out infinite;}
  .role.vip{--g:255,158,199; animation:actglow 3.6s ease-in-out infinite;}
  .s-item.on{animation:actglow 4.2s ease-in-out infinite;}
  .ev-next{
    background:rgba(0,210,190,.06); border:1px solid rgba(0,210,190,.3); border-radius:11px;
    padding:11px 14px; margin-bottom:11px; font-size:13px;
  }
  .ev-next .k{font-size:10.5px; font-weight:800; letter-spacing:.1em; color:var(--lime); margin-bottom:3px;}
  /* 가계부 */
  .mon-nums{display:flex; gap:8px; margin-bottom:13px;}
  .mn{flex:1; background:var(--card2); border:1px solid var(--line2); border-radius:11px; padding:11px 12px; text-align:center;}
  .mn .k{font-size:10.5px; font-weight:800; color:var(--sub2); letter-spacing:.06em;}
  .mn .v{font-size:15px; font-weight:900; margin-top:2px; font-variant-numeric:tabular-nums;}
  .mn .v.lime{color:var(--lime);}
  .mn .v.red{color:var(--red);}
  .gauge{height:8px; background:rgba(255,255,255,.07); border-radius:999px; overflow:hidden; margin:4px 0 3px;}
  .gauge .gb{height:100%; border-radius:999px; background:var(--grad-bar); transition:width .5s;}
  .gauge .gb.warn{background:linear-gradient(90deg,#e8b34b,var(--red));}
  .glabel{display:flex; justify-content:space-between; font-size:11px; color:var(--sub2); font-variant-numeric:tabular-nums; margin-bottom:13px;}
  .cats{display:flex; flex-direction:column; gap:7px;}
  .cat{display:grid; grid-template-columns:76px 1fr auto; gap:9px; align-items:center; font-size:12px;}
  .cat .cn{color:var(--sub); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cat .cb{height:6px; background:rgba(255,255,255,.06); border-radius:999px; overflow:hidden;}
  .cat .cb i{display:block; height:100%; background:var(--grad-bar); opacity:.9; border-radius:999px;}
  .cat .cv{color:var(--sub2); font-variant-numeric:tabular-nums; font-size:11px;}
  /* 출금 */
  .wd{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; align-items:baseline;}
  .wd:last-child{border-bottom:none;}
  .wd .d{width:56px; flex-shrink:0; color:var(--sub2); font-size:11.5px; font-weight:700;}
  .wd .t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .wd .a{font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums;}
  @media(max-width:860px){ .wgrid{grid-template-columns:1fr;} }

  /* ===== 모션 & 앰비언스 ===== */
  .orbs{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .orbs i{position:absolute; left:50%; top:44%; width:min(1100px,120vw); height:min(720px,90vh);
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(closest-side, rgba(0,210,190,.19), rgba(0,210,190,.06) 55%, transparent 76%);
    animation:bloom 1.7s cubic-bezier(.16,.7,.3,1) both, breathe 9s ease-in-out 1.7s infinite;}
  .orbs i:nth-child(2){width:min(700px,90vw); height:min(460px,60vh); top:46%;
    background:radial-gradient(closest-side, rgba(45,105,170,.15), transparent 72%);
    animation:bloom 2.1s cubic-bezier(.16,.7,.3,1) both, breathe 13s ease-in-out 2.3s infinite;}
  @keyframes bloom{from{opacity:0; transform:translate(-50%,-50%) scale(.5)}to{opacity:1; transform:translate(-50%,-50%) scale(1)}}
  @keyframes breathe{0%,100%{opacity:1; transform:translate(-50%,-50%) scale(1)}50%{opacity:.88; transform:translate(-50%,-50%) scale(1.04)}}


  .widget{
    transition:border-color .25s, box-shadow .25s, transform .25s;
    animation:rise .55s cubic-bezier(.2,.7,.2,1) both;
  }
  .widget:hover{border-color:rgba(0,210,190,.35); box-shadow:var(--glow-soft); transform:translateY(-2px);}
  .wgrid .widget:nth-child(1){animation-delay:.04s}
  .wgrid .widget:nth-child(2){animation-delay:.1s}
  .wgrid .widget:nth-child(3){animation-delay:.16s}
  .wgrid .widget:nth-child(4){animation-delay:.22s}
  @keyframes rise{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:none}}
  .fcard,.dcard{animation:pop .28s ease both;}
  @keyframes pop{from{opacity:0; transform:translateY(8px) scale(.985)}to{opacity:1; transform:none}}

  .gauge .gb{position:relative; overflow:hidden;}
  .gauge .gb::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 32%, rgba(255,255,255,.3) 50%, transparent 68%);
    transform:translateX(-100%); animation:shine 3s ease 1.2s infinite;
  }
  @keyframes shine{60%,100%{transform:translateX(100%)}}
  .cat .cb i{transform-origin:left; animation:growx .7s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes growx{from{transform:scaleX(0)}}
  .ev-next{animation:actglow 4.5s ease-in-out infinite;}
  .fxline{
    margin-top:13px; padding-top:12px; border-top:1px solid var(--line);
    font-size:11.5px; color:var(--sub2); display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;
    font-variant-numeric:tabular-nums;
  }
  .fxline b{color:var(--sub); font-weight:800;}
  .modal.wide{max-width:640px; max-height:84vh; overflow:auto;}
  .mnav{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:12px; font-size:15px;}
  .mgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .mgrid .mh{font-size:10.5px; font-weight:800; color:var(--sub2); text-align:center; padding:4px 0;}
  .mgrid .md{
    min-height:58px; background:var(--card2); border:1px solid var(--line); border-radius:8px;
    padding:4px 5px; font-size:10px; overflow:hidden;
  }
  .mgrid .md.off{background:none; border-color:transparent;}
  .mgrid .md.today{border-color:rgba(0,210,190,.5); box-shadow:var(--glow-soft);}
  .mgrid .dn2{font-size:10.5px; font-weight:800; color:var(--sub2); display:block; margin-bottom:2px;}
  .mgrid .md.today .dn2{color:var(--lime);}
  .mgrid .me{
    display:block; font-size:9px; color:var(--ink); background:rgba(0,210,190,.13);
    border-radius:4px; padding:1px 4px; margin-bottom:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .mgrid .me.more{background:none; color:var(--sub2);}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    background:var(--card2); border:1px solid var(--line2); border-radius:999px; cursor:pointer;
    font-size:11px; font-weight:800; color:var(--sub); padding:5px 12px; font-variant-numeric:tabular-nums;
  }
  .chip.on{color:#021413; background:var(--grad); border-color:transparent;}
  .drow{display:flex; justify-content:space-between; gap:10px; padding:7px 2px; border-bottom:1px solid var(--line); font-size:13px; font-variant-numeric:tabular-nums;}
  .drow.p span{font-weight:800; color:var(--ink);}
  .drow.p b{color:var(--ink);}
  .drow.s{padding-left:16px; font-size:12.5px;}
  .drow.s span{color:var(--sub2);}
  .drow.s b{color:var(--sub); font-weight:700;}
  .widget{cursor:pointer; position:relative;}
  .dash.editing .widget{animation:wiggle .32s ease-in-out infinite; cursor:default;}
  .dash.editing .widget:nth-child(odd){animation-delay:.08s;}
  @keyframes wiggle{0%,100%{transform:rotate(-.45deg)}50%{transform:rotate(.45deg)}}
  .mvbtn{
    position:absolute; top:-11px; width:26px; height:26px; border-radius:50%; z-index:3; cursor:pointer;
    background:var(--grad); border:none; color:#021413; font-size:13px; font-weight:900;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.4);
  }
  .mvbtn.prev{left:-9px;} .mvbtn.next{right:-9px;}
  .widget .qadd,.widget .qadd *{cursor:auto;}
  .checker{
    height:10px; width:170px; margin:0 auto;
    background:repeating-conic-gradient(#c9ced4 0% 25%, transparent 0% 50%);
    background-size:10px 10px; opacity:.4; transform:skewX(-22deg); border-radius:2px;
  }
  .checker.sm{width:110px; height:8px; background-size:8px 8px;}
  .hidden{display:none !important;}

  @media(max-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
    .drop{display:none !important;}
    .v-bar{padding:8px 10px; gap:8px;}
    .v-bar .nm{font-size:12.5px;}
    .v-meta{display:none;}
    #c-wrap{max-height:30vh;}
  }
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="wgi" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22">
<stop offset="0" stop-color="#b8f24b"/><stop offset=".5" stop-color="#00d2be"/><stop offset="1" stop-color="#0077b6"/></linearGradient>
<linearGradient id="wgf" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22">
<stop offset="0" stop-color="#9be049"/><stop offset=".5" stop-color="#00c2b0"/><stop offset="1" stop-color="#0077b6"/></linearGradient>
</defs></svg>


<!-- 로그인 게이트 -->
<div id="gate">

<script>

const SESSION_HOURS=24;
const MAX_VERSIONS=3;
const firebaseConfig={
  apiKey:"AIzaSyBWK9r4-HwOfhJWxFCy2uzvIceRDoMfZxQ",
  authDomain:"jim-s-document.firebaseapp.com",
  databaseURL:"https://jim-s-document-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"jim-s-document",
  storageBucket:"jim-s-document.firebasestorage.app",
  messagingSenderId:"210701764992",
  appId:"1:210701764992:web:87517da8493493f84a1965"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

/* ================= 상태 ================= */
let ME=null, IS_MASTER=false, curView="docs";

(function(){
  const pid=new URLSearchParams(location.search).get("p");
  if(!pid)return;
  document.getElementById("gate").style.display="none";
  const wrap=document.createElement("div");
  wrap.style.cssText="position:fixed;inset:0;z-index:500;background:#0a0b0c";
  wrap.innerHTML='<iframe id="pub-frame" style="width:100%;height:100%;border:none;background:#fff" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>';
  document.body.appendChild(wrap);
  db.ref("hub/publish/"+pid).get().then(s=>{
    const v=s.val();
    if(!v){wrap.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#9aa3a9;font-size:14px">게시된 문서가 아니에요</div>';return;}
    document.title=v.name||"JimStorage";
    document.getElementById("pub-frame").srcdoc=v.html;
  }).catch(()=>{
    wrap.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#9aa3a9;font-size:14px">불러오지 못했어요</div>';
  });
})();

const I_FOLDER='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 7q0-2 2-2h5l2 2h7q2 0 2 2v8q0 2-2 2H5q-2 0-2-2Z" fill="url(#wgf)"/><path d="M3 7q0-2 2-2h5l1.2 1.2H5q-1 0-1 1Z" fill="rgba(255,255,255,.22)"/></svg>';
const I_FOLDER_LOCK='<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><rect x="4.5" y="10" width="15" height="10.5" rx="2.6" fill="#c9ced4"/><path d="M7.8 10V7.4a4.2 4.2 0 0 1 8.4 0V10" fill="none" stroke="#c9ced4" stroke-width="2.5"/><circle cx="12" cy="15.2" r="1.8" fill="#121416"/></svg>';
const I_LOCK='<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="vertical-align:-1.5px"><rect x="5" y="10" width="14" height="10" rx="2.5" fill="#c9ced4"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10" fill="none" stroke="#c9ced4" stroke-width="2.4"/><circle cx="12" cy="15" r="1.7" fill="#121416"/></svg>';
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2400);}
const fmtDate=ts=>{const d=new Date(ts);return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");};
const fmtTime=ts=>{const d=new Date(ts);return fmtDate(ts)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};

/* ================= 인증 ================= */
const GOOGLE_CLIENT_ID="210701764992-a0omjn0iam90jm3v05te26nq6fajd1ff.apps.googleusercontent.com";
function googleDirectRedirect(){
  /* 웹앱(iOS standalone)에서 Firebase 리다이렉트가 저장소 파티셔닝에 막히므로
     구글과 직접 왕복 후 ID 토큰으로 Firebase에 로그인 */
  const nonce=Math.random().toString(36).slice(2)+Date.now().toString(36);
  const redirect="https://wlals3875.github.io/Jim-document/"; /* 콘솔 등록값과 정확히 일치해야 함 */
  location.href="https://accounts.google.com/o/oauth2/v2/auth"
    +"?client_id="+encodeURIComponent(GOOGLE_CLIENT_ID)
    +"&redirect_uri="+encodeURIComponent(redirect)
    +"&response_type=id_token"
    +"&scope="+encodeURIComponent("openid email profile")
    +"&nonce="+nonce
    +"&prompt=select_account";
}
/* 구글에서 돌아온 경우: 해시의 ID 토큰으로 로그인 */
(function(){
  if(!location.hash)return;
  const p=new URLSearchParams(location.hash.slice(1));
  const idt=p.get("id_token"), err=p.get("error"), at=p.get("access_token"), exp=p.get("expires_in");
  if(idt||err||at)history.replaceState(null,"",location.pathname+location.search);
  if(err){
    let silent=false; try{silent=!!sessionStorage.getItem("gsilent");}catch(e){}
    if(!(silent&&/interaction_required|login_required|consent_required|immediate_failed/.test(err)))toast("로그인 취소/실패: "+err);
    return;
  }
  if(at){
    try{
      localStorage.setItem("hub-gtoken",JSON.stringify({t:at,exp:Date.now()+(+exp||3600)*1000-60000}));
      sessionStorage.removeItem("gsilent");
    }catch(e){}
  }
  if(idt){
    const cred=firebase.auth.GoogleAuthProvider.credential(idt);
    auth.signInWithCredential(cred).catch(e=>toast("로그인 실패: "+e.code));
  }
})();
$("login-btn").onclick=()=>{
  const standalone=(navigator.standalone===true)||matchMedia("(display-mode: standalone)").matches;
  if(standalone){ googleDirectRedirect(); return; }
  const p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(e=>{
    if(e.code==="auth/popup-blocked"||e.code==="auth/popup-closed-by-user"||e.code==="auth/operation-not-supported-in-this-environment"){
      googleDirectRedirect();
    }else toast("로그인 실패: "+e.code);
  });
};
$("avatar").onclick=()=>{ if(confirm("로그아웃할까요?")){ localStorage.removeItem("hub-login-at"); try{localStorage.removeItem("hub-gtoken");}catch(e){} auth.signOut(); } };

auth.onAuthStateChanged(u=>{
  if(u){
    /* 24시간 세션 체크 */
    const at=+localStorage.getItem("hub-login-at")||0;
    if(at && Date.now()-at > SESSION_HOURS*3600*1000){
      localStorage.removeItem("hub-login-at"); auth.signOut(); return;
    }
    if(!at) localStorage.setItem("hub-login-at",Date.now());
    ME=u; IS_MASTER=(u.email===MASTER_EMAIL);
    if(!IS_MASTER){

/* ================= 데이터 구독 ================= */
let subs=[];
function subscribe(){
  subs.forEach(fn=>fn()); subs=[];
  const watch=(path,cb)=>{const r=db.ref(path);const h=r.on("value",s=>{cb(s.val()||{});render();});subs.push(()=>r.off("value",h));};
  watch("hub/pub/folders",v=>DATA.pub.folders=v);
  watch("hub/pub/docs",v=>DATA.pub.docs=v);
  watch("hub/views",v=>VIEWS=v);
  if(IS_MASTER){
    watch("hub/priv/folders",v=>DATA.priv.folders=v);
    watch("hub/priv/docs",v=>DATA.priv.docs=v);
  }
}

/* ================= 렌더 ================= */
function fScope(fid){ if(DATA.priv.folders[fid])return"priv"; if(DATA.pub.folders[fid])return"pub"; return null; }
function dScope(did){ if(DATA.priv.docs[did])return"priv"; if(DATA.pub.docs[did])return"pub"; return null; }
function getFolder(fid){ return DATA.priv.folders[fid]||DATA.pub.folders[fid]; }
function curFolderScope(){ return curFolder==="root"?"pub":(fScope(curFolder)||"pub"); }

function folderPath(fid){
  const out=[]; let cur=fid; let guard=0;
  while(cur&&cur!=="root"&&guard++<50){ const f=getFolder(cur); if(!f)break; out.unshift({id:cur,name:f.name}); cur=f.parent; }
  return out;
}
function render(){
  if(!ME) return;
  /* 크럼 */
  const path=folderPath(curFolder);
  let c=`<a href="#" data-nav="root">전체</a>`;
  path.forEach(p=>{ c+=`<span class="sep">›</span><a href="#" data-nav="${p.id}">${esc(p.name)}</a>`; });
  if(curFolder!=="root"){
    const sc=fScope(curFolder);
    c+=`<span class="vis ${sc==="priv"?"priv":"pub"}">${sc==="priv"?I_LOCK+" 비공개":"공개"}</span>`;
  }
  $("crumb").innerHTML=c;
  $("crumb").querySelectorAll("a").forEach(a=>a.onclick=e=>{e.preventDefault();curFolder=a.dataset.nav;render();});

  /* 목록 (마스터: 공개+비공개 병합 / 방문자: 공개만) */
  const q=($("search").value||"").trim().toLowerCase();
  const sort=$("sort").value;

  let folders=Object.entries(DATA.pub.folders).map(([id,f])=>({id,...f,scope:"pub"}));
  let docs=Object.entries(DATA.pub.docs).map(([id,d])=>({id,...d,scope:"pub",views:(VIEWS[id]||0)}));
  if(IS_MASTER){
    folders=folders.concat(Object.entries(DATA.priv.folders).map(([id,f])=>({id,...f,scope:"priv"})));
    docs=docs.concat(Object.entries(DATA.priv.docs).map(([id,d])=>({id,...d,scope:"priv",views:(VIEWS[id]||0)})));
  }
  const inCur=x=>{
    const p=x.parent!==undefined?x.parent:x.folder;
    const pid=p||"root";
    if(pid===curFolder)return true;
    /* 부모가 사라진 항목은 최상위로 */
    if(curFolder==="root"&&pid!=="root"&&!getFolder(pid))return true;
    return false;
  };
  if(q){
    folders=folders.filter(f=>f.name.toLowerCase().includes(q));
    docs=docs.filter(d=>d.name.toLowerCase().includes(q)||(d.tags||"").toLowerCase().includes(q));
  }else{
    folders=folders.filter(inCur);
    docs=docs.filter(inCur);
  }
  const cmp={recent:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0),
             name:(a,b)=>a.name.localeCompare(b.name,"ko"),
             views:(a,b)=>(b.views||0)-(a.views||0)}[sort];
  folders.sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  docs.sort((a,b)=>((b.pinned?1:0)-(a.pinned?1:0))||cmp(a,b));

  const allDocs=docs=>docs; /* noop */
  let html="";
  if(q) html+=`<div class="sec-label">"${esc(q)}" 검색 결과</div>`;

          .forEach(([fid,ff])=>{if(ff.parent===id)ids=ids.concat(collect(fid));});
        return ids;
      })(f.id);
      const cnt=Object.values(DATA.pub.docs).filter(d=>subIds.includes(d.folder)).length
        +(IS_MASTER?Object.values(DATA.priv.docs).filter(d=>subIds.includes(d.folder)).length:0);
      return `<div class="fcard" data-f="${f.id}">
        ${IS_MASTER?`<button class="kebab" data-fm="${f.id}">⋯</button>`:""}
        <span class="fi">${f.scope==="priv"?I_FOLDER_LOCK:I_FOLDER}</span><div class="nm">${esc(f.name)}</div>
        <div class="meta">문서 ${cnt}개${f.scope==="priv"?" · 나만 보기":""}</div></div>`;
    }).join("")+`</div>`;
  }
  if(docs.length){
    html+=`<div class="sec-label">문서</div><div class="grid">`+docs.map(d=>{
      const link=d.type==="link";
      return `<div class="dcard" data-d="${d.id}">
        ${IS_MASTER?`<button class="kebab" data-dm="${d.id}">⋯</button>`:""}
        <div class="nm">${d.pinned?'<span class="pin">📌</span>':""}${d.scope==="priv"?I_LOCK+" ":""}${link?'<svg class="wic" viewBox="0 0 24 24"><path d="M9.7 14.3l4.6-4.6M8.2 11.2l-2.4 2.4a3.4 3.4 0 0 0 4.8 4.8l2.4-2.4M11 8.6L13.4 6.2a3.4 3.4 0 0 1 4.8 4.8L15.8 13.4"/></svg> ':""}${esc(d.name)}</div>
        ${d.desc?`<div class="desc">${esc(d.desc)}</div>`:""}
        ${d.tags?`<div class="tags">${d.tags.split(",").map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
        <div class="meta">${fmtDate(d.updatedAt||d.createdAt)} · 조회 ${d.views||0}${d.published?' · <svg class="wic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.7 2.4 2.7 14.6 0 17-2.7-2.4-2.7-14.6 0-17"/></svg> 게시됨':""}</div></div>`;
    }).join("")+`</div>`;
  }
  if(!folders.length&&!docs.length){
    html+=`<div class="empty-msg">
      <svg width="64" height="58" viewBox="0 0 64 58" aria-hidden="true" style="display:block;margin:0 auto 10px">
        <defs><pattern id="chk2" width="10" height="10" patternUnits="userSpaceOnUse">
          <rect width="5" height="5" fill="#c9ced4"/><rect x="5" y="5" width="5" height="5" fill="#c9ced4"/>
        </pattern></defs>

        <circle cx="9.4" cy="4.5" r="2.6" fill="#8d959b"/>
        <path d="M12 8 C 26 3, 40 12, 58 6 L 56 28 C 40 34, 27 26, 12 30 Z" fill="url(#chk2)" stroke="#3a4045" stroke-width="1"/>
        <path d="M56 28 C 40 34, 27 26, 12 30" fill="none" stroke="#00d2be" stroke-width="1.4" opacity=".7"/>
      </svg>${q?"검색 결과가 없어요":"아직 비어 있어요"+(IS_MASTER?" — 폴더를 만들거나 HTML을 올려보세요":"")}</div>`;
  }
  $("listing").innerHTML=html;

  $("listing").querySelectorAll(".fcard").forEach(el=>el.onclick=e=>{

  $("listing").querySelectorAll("[data-dm]").forEach(b=>b.onclick=e=>{e.stopPropagation();docMenu(b.dataset.dm,b);});
  renderTree();
}
function renderTree(){
  let folders=Object.entries(DATA.pub.folders).map(([id,f])=>({id,...f,scope:"pub"}));
  if(IS_MASTER)folders=folders.concat(Object.entries(DATA.priv.folders).map(([id,f])=>({id,...f,scope:"priv"})));
  const byParent={};
  folders.forEach(f=>{
    let p=f.parent||"root"; if(p!=="root"&&!getFolder(p))p="root";
    (byParent[p]=byParent[p]||[]).push(f);
  });
  const build=(pid,depth)=>{
    const kids=(byParent[pid]||[]).sort((a,b)=>a.name.localeCompare(b.name,"ko"));
    return kids.map(f=>`
      <button class="s-item${curView==="docs"&&curFolder===f.id?" on":""}" data-go="${f.id}" style="padding-left:${10+depth*15}px">
        <span class="ic">${f.scope==="priv"?I_FOLDER_LOCK:I_FOLDER}</span><span class="tx">${esc(f.name)}</span>
      </button>`+build(f.id,depth+1)).join("");
  };
  const html=build("root",0);
  $("tree").innerHTML=html||`<div class="s-empty">폴더가 없어요</div>`;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    curFolder=b.dataset.go; $("search").value=""; setView("docs"); render(); closeAside();
  });
  document.querySelectorAll('.s-item[data-go="root"]').forEach(b=>b.classList.toggle("on",curView==="docs"&&curFolder==="root"));
}

    "—",
    {label:"삭제 (하위 포함)",warn:true,fn:()=>deleteFolder(fid)}
  ]);
}
function collectTree(fid){
  /* 양쪽 영역을 모두 순회 (마스터 전용 기능) */
  const fids=[{id:fid,scope:fScope(fid)}], dids=[];
  const walk=id=>{
    for(const sc of ["pub","priv"]){
      Object.entries(DATA[sc].folders).forEach(([k,f])=>{
        if(f.parent===id){fids.push({id:k,scope:sc});walk(k);}
      });
    }
  };
  walk(fid);
  const fidSet=fids.map(x=>x.id);
  for(const sc of ["pub","priv"]){
    Object.entries(DATA[sc].docs).forEach(([k,d])=>{
      if(fidSet.includes(d.folder||"root"))dids.push({id:k,scope:sc});
    });
  }
  return {fids,dids};
}
async function deleteFolder(fid){
  const {fids,dids}=collectTree(fid);
  if(!confirm(`폴더와 하위 폴더 ${fids.length-1}개, 문서 ${dids.length}개가 삭제돼요. 계속?`))return;
  const up={};
  fids.forEach(f=>up[`hub/${f.scope}/folders/${f.id}`]=null);
  for(const d of dids){
    up[`hub/${d.scope}/docs/${d.id}`]=null;
    up[`hub/${d.scope}/contents/${d.id}`]=null;
    up[`hub/${d.scope}/versions/${d.id}`]=null;
    up[`hub/comments/${d.id}`]=null; up[`hub/views/${d.id}`]=null;
  }
  await db.ref().update(up); toast("삭제됨"); computeStorageSoon();
  if(fids.some(f=>f.id===curFolder))curFolder="root";
}
async function moveFolderScope(fid){
  const src=fScope(fid), dst=src==="pub"?"priv":"pub";
  const {fids,dids}=collectTree(fid);
  const up={};
  for(const f of fids){
    up[`hub/${dst}/folders/${f.id}`]=DATA[f.scope].folders[f.id];
    if(f.scope!==dst)up[`hub/${f.scope}/folders/${f.id}`]=null;
  }
  for(const d of dids){
    const meta=DATA[d.scope].docs[d.id];
    const cont=(await db.ref(`hub/${d.scope}/contents/${d.id}`).get()).val();
    const vers=(await db.ref(`hub/${d.scope}/versions/${d.id}`).get()).val();
    up[`hub/${dst}/docs/${d.id}`]=meta;
    if(cont!=null)up[`hub/${dst}/contents/${d.id}`]=cont;
    if(vers)up[`hub/${dst}/versions/${d.id}`]=vers;
    if(d.scope!==dst){
      up[`hub/${d.scope}/docs/${d.id}`]=null;
      up[`hub/${d.scope}/contents/${d.id}`]=null;
      up[`hub/${d.scope}/versions/${d.id}`]=null;
    }
  }
  /* 공개로 전환하는데 부모가 비공개면 최상위로 이동 */
  const parent=getFolder(fid)?.parent||"root";
  if(dst==="pub"&&parent!=="root"&&fScope(parent)==="priv"){
    up[`hub/${dst}/folders/${fid}/parent`]="root";
  }
  await db.ref().update(up);
  toast(dst==="priv"?"🔒 비공개로 전환됨":'<svg class="wic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.7 2.4 2.7 14.6 0 17-2.7-2.4-2.7-14.6 0-17"/></svg> 공개로 전환됨');
}

async function handleFiles(files){
  for(const f of files){
    if(!/\.html?$/i.test(f.name)){toast(f.name+" — HTML 파일만 가능해요");continue;}
    if(f.size>800*1024){toast(f.name+" — 800KB 이하만 가능해요");continue;}
    const html=await f.text();
    await saveDoc(f.name,html);
  }
}
async function saveDoc(name,html){
  const scope=curFolderScope();
  const D=DATA[scope].docs;
  const exist=Object.entries(D).find(([id,d])=>d.name===name&&(d.folder||"root")===curFolder&&d.type!=="link");
  if(exist){
    const [did]=exist;
    const up2={};
    up2[`hub/${scope}/contents/${did}`]=html;
    up2[`hub/${scope}/docs/${did}/updatedAt`]=Date.now();
    await db.ref().update(up2);
    if(D[did]&&D[did].published)db.ref("hub/publish/"+did).update({html,name,at:Date.now()}).catch(()=>{});
    toast(`"${name}" 교체됨 (댓글·조회수 유지)`); computeStorageSoon();
  }else{
    const ref=db.ref(`hub/${scope}/docs`).push();
    await ref.set({name,folder:curFolder,createdAt:Date.now(),updatedAt:Date.now(),type:"html"});
    await db.ref(`hub/${scope}/contents/${ref.key}`).set(html);
    toast(scope==="priv"?`🔒 "${name}" 업로드됨 (비공개)`:`"${name}" 업로드됨`); computeStorageSoon();
  }
}

async function moveDocScope(did,scope){
  const dst=scope==="pub"?"priv":"pub";
  const meta=DATA[scope].docs[did];
  const cont=(await db.ref(`hub/${scope}/contents/${did}`).get()).val();
  const vers=(await db.ref(`hub/${scope}/versions/${did}`).get()).val();
  /* 공개 전환인데 폴더가 비공개면 최상위로 */
  let folder=meta.folder||"root";
  if(dst==="pub"&&folder!=="root"&&fScope(folder)==="priv")folder="root";
  const up={};
  up[`hub/${dst}/docs/${did}`]={...meta,folder};
  if(cont!=null)up[`hub/${dst}/contents/${did}`]=cont;
  if(vers)up[`hub/${dst}/versions/${did}`]=vers;
  up[`hub/${scope}/docs/${did}`]=null;
  up[`hub/${scope}/contents/${did}`]=null;
  up[`hub/${scope}/versions/${did}`]=null;
  await db.ref().update(up);
  toast(dst==="priv"?"🔒 비공개로 전환됨":'<svg class="wic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.7 2.4 2.7 14.6 0 17-2.7-2.4-2.7-14.6 0-17"/></svg> 공개로 전환됨');
}

/* ================= 스토리지 사용량 (마스터) ================= */
const STORAGE_LIMIT=1024*1024*1024; /* Firebase 무료 플랜 1GB */
let storTimer=null;
function computeStorageSoon(){ clearTimeout(storTimer); storTimer=setTimeout(computeStorage,1500); }
async function computeStorage(){
  if(!IS_MASTER)return;
  try{
    const paths=["hub/pub/contents","hub/priv/contents","hub/pub/versions","hub/priv/versions","hub/pub/docs","hub/priv/docs","hub/comments","hub/visits","fukuoka"];
    let bytes=0, fails=0;
    for(const p of paths){
      try{
        const v=(await db.ref(p).get()).val();
        if(v!=null)bytes+=new Blob([JSON.stringify(v)]).size;
      }catch(e){ fails++; }
    }
    if(fails===paths.length)throw new Error("all failed");
    const mb=bytes/1048576;
    const num=mb>=1024?(mb/1024).toFixed(2)+" GB":mb>=1?mb.toFixed(1)+" MB":(bytes/1024).toFixed(0)+" KB";
    $("st-num").textContent=num+" / 1 GB";
    const pct=Math.min(100,bytes/STORAGE_LIMIT*100);
    $("st-bar").style.width=Math.max(1,pct)+"%";
    $("st-pct").textContent=pct<0.1?pct.toFixed(3)+"% 사용 중":pct.toFixed(2)+"% 사용 중";
  }catch(e){ $("st-num").textContent="측정 실패"; }
}

async function gfetch(url,opt){
  busy(true);

async function _gfetch(url,opt){
  const t=gtoken(); if(!t)throw new Error("no-token");
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({"Authorization":"Bearer "+t},(opt&&opt.headers)||{})}));

  const wds=evs.filter(e=>evEnd(e)>=now).map(e=>{
    const warm=WARM.includes(e.colorId);

  if(wds.length){
    const total=wds.reduce((s,x)=>s+(x.amt||0),0);

      const dd=evDate(x.e);

      return '<div class="wd"><span class="d">'+(dd.getMonth()+1)+"/"+dd.getDate()+" "+DAYS[dd.getDay()]+'</span>'
        +'<span class="t">'+nm+'</span><span class="a">'+(x.amt!=null?x.amt.toLocaleString()+"원":"—")+'</span></div>';

let SHEET=null; /* {grid, monthCol, rows:{예산,잔여,소진율,지출금액}, catRows:{}} */
function monKey(){const d=new Date();return String(d.getFullYear()%100).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");}
function colA1(i){let s="";i++;while(i){s=String.fromCharCode(65+(i-1)%26)+s;i=Math.floor((i-1)/26);}return s;}
async function loadSheet(){
  const d=await gfetch("https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+"/values/Details!A1:U90?valueRenderOption=UNFORMATTED_VALUE");
  const g=d.values||[];
  const hdr=g[1]||[];

  if(mc<0){$("money-body").innerHTML='<div class="w-empty">시트에 '+mk+' 월 컬럼이 없어요</div>';return;}
  const norm=s=>String(s||"").replace(/\s+/g,"");
  const find=lbl=>{const L=norm(lbl);for(let r=0;r<g.length;r++){if(norm((g[r]||[])[1])===L)return r;}return -1;};
  const rows={예산:find("예산"),잔여:find("잔여"),소진율:find("소진율"),지출금액:find("지출 금액"),지출가능:find("지출 가능"),
              보험:find("보험"),고정지출:find("고정 지출"),저축:find("저축")};
  /* 지출 카테고리·세부항목 행 매핑 */
  const catRows={}, targetRows={};
  for(let r=38;r<g.length;r++){
    const lbl=String((g[r]||[])[1]||"").trim();
    if(CATS.includes(lbl)&&catRows[lbl]===undefined)catRows[lbl]=r;
  }
  for(const c of CATTREE){
    const pr=catRows[c.cat]; if(pr===undefined)continue;
    if(!c.subs.length){targetRows[c.cat]=pr;continue;}
    for(const s of c.subs){
      for(let r=pr+1;r<Math.min(pr+9,g.length);r++){
        if(String((g[r]||[])[1]||"").trim()===s.n){targetRows[c.cat+">"+s.n]=r;break;}
      }
    }
  }
  SHEET={g,mc,rows,catRows,targetRows};
  const num=r=>{const v=r>=0?(g[r]||[])[mc]:null;return typeof v==="number"?v:(v&&!isNaN(+v)?+v:null);};
  const budget=num(rows.예산), spent=num(rows.지출금액), remain=num(rows.잔여), cap=num(rows.지출가능);
  const rate=cap&&spent!=null?spent/cap:null;
  const w=v=>v==null?"—":Math.round(v).toLocaleString();
  $("money-mon").textContent=mk;
  let html='<div class="mon-nums">'
    +'<div class="mn"><div class="k">예산</div><div class="v" data-n="'+(budget!=null?Math.round(budget):"")+'">'+w(budget)+'</div></div>'
    +'<div class="mn"><div class="k">지출</div><div class="v" data-n="'+(spent!=null?Math.round(spent):"")+'">'+w(spent)+'</div></div>'
    +'<div class="mn"><div class="k">잔여</div><div class="v '+(remain!=null&&remain<0?"red":"lime")+'" data-n="'+(remain!=null?Math.round(remain):"")+'">'+w(remain)+'</div></div>'
    +'</div>';
  if(rate!=null){
    const pct=Math.min(100,rate*100);
    html+='<div class="gauge"><div class="gb'+(pct>90?" warn":"")+'" style="width:'+pct+'%"></div></div>'
      +'<div class="glabel"><span>소진율</span><span>'+(rate*100).toFixed(1)+'%</span></div>';
  }
  /* 카테고리 바 */
  const cvs=CATS.map(c=>({c,v:(()=>{const v=(g[catRows[c]]||[])[mc];return typeof v==="number"?v:0;})()})).filter(x=>x.v>0);
  if(cvs.length){
    const mx=Math.max(...cvs.map(x=>x.v));
    html+='<div class="cats">'+cvs.sort((a,b)=>b.v-a.v).map(x=>
      '<div class="cat"><span class="cn">'+x.c+'</span><span class="cb"><i style="width:'+(x.v/mx*100)+'%"></i></span><span class="cv">'+Math.round(x.v).toLocaleString()+'</span></div>'
    ).join("")+'</div>';
  }
  /* 고정지출·보험·저축 */
  const fx=num(rows.고정지출), ins=num(rows.보험), sav=num(rows.저축);
  html+='<div class="fxline">고정지출 <b>'+w(fx)+'</b><span>·</span>보험 <b>'+w(ins)+'</b><span>·</span>저축 <b>'+w(sav)+'</b></div>';
  $("money-body").innerHTML=html;
  animateNums($("money-body"));
}
/* 숫자 카운트업 */
function animateNums(root){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  root.querySelectorAll("[data-n]").forEach(el=>{
    const target=+el.dataset.n; if(!el.dataset.n||isNaN(target))return;
    const st=performance.now(), dur=650;
    const tick=t=>{
      const p=Math.min(1,(t-st)/dur), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*e).toLocaleString();
      if(p<1)requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function parseCalInput(s){
  s=s.trim(); if(!s)return null;

  if(!dm)return null;
  const now=new Date();
  let y=now.getFullYear(), mo=+dm[1], da=+dm[2];
  const cand=new Date(y,mo-1,da);
  if(cand<new Date(now.getFullYear(),now.getMonth(),now.getDate()-30))y++;
  let rest=(s.slice(0,dm.index)+s.slice(dm.index+dm[0].length)).trim();
  let allDay=false, sh=null, sm=0, eh=null, em=0;
  if(/종일/.test(rest)){ allDay=true; rest=rest.replace(/종일/,"").trim(); }
  else{
    let tm=rest.match(/(\d{1,2})(?::(\d{2}))?\s*(?:시)?\s*[~\-]\s*(\d{1,2})(?::(\d{2}))?\s*시?/);
    if(tm){ sh=+tm[1]; sm=+(tm[2]||0); eh=+tm[3]; em=+(tm[4]||0); rest=(rest.slice(0,tm.index)+rest.slice(tm.index+tm[0].length)).trim(); }
    else{
      tm=rest.match(/(\d{1,2})(?::(\d{2}))?\s*시(\s*반)?/)||rest.match(/(\d{1,2}):(\d{2})/);
      if(tm){ sh=+tm[1]; sm=tm[3]?30:+(tm[2]||0); eh=sh+1; em=sm; rest=(rest.slice(0,tm.index)+rest.slice(tm.index+tm[0].length)).trim(); }
      else allDay=true;
    }
  }
  const title=rest.replace(/\s+/g," ").trim();
  if(!title)return null;
  return {y,mo,da,allDay,sh,sm,eh,em,title};
}
const p2=n=>String(n).padStart(2,"0");
function calPrevText(p){
  const d=p.y+"."+p2(p.mo)+"."+p2(p.da);
  return p.allDay?d+" · 종일":d+" · "+p2(p.sh)+":"+p2(p.sm)+"–"+p2(p.eh)+":"+p2(p.em);
}

let calCache={}, calMonth=new Date();
async function fetchMonth(y,m){
  const key=y+"-"+m;
  if(calCache[key])return calCache[key];
  const t0=new Date(y,m,1), t1=new Date(y,m+1,1);
  const d=await gfetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=250"
    +"&timeMin="+encodeURIComponent(t0.toISOString())+"&timeMax="+encodeURIComponent(t1.toISOString()));
  return calCache[key]=(d.items||[]).filter(e=>e.status!=="cancelled");
}
async function openCalDetail(){
  if(!gtoken()){connectGoogle();return;}
  const bg=modal('<h3><svg class="wic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg> 캘린더</h3><div id="det"></div><div class="m-row"><button class="mbtn" data-x>닫기</button></div>',
    b=>{b.querySelector("[data-x]").onclick=()=>b.remove(); b.querySelector(".modal").classList.add("wide");});
  const det=bg.querySelector("#det");
  async function draw(){
    const y=calMonth.getFullYear(), m=calMonth.getMonth();
    det.innerHTML='<div class="w-empty">불러오는 중…</div>';
    let evs=[]; try{evs=await fetchMonth(y,m);}catch(e){det.innerHTML='<div class="w-empty">불러오기 실패</div>';return;}
    const byDay={};
    evs.forEach(e=>{
      const s=e.start.dateTime?new Date(e.start.dateTime):new Date(e.start.date+"T00:00:00");
      let en=e.end?(e.end.dateTime?new Date(e.end.dateTime):new Date(e.end.date+"T00:00:00")):new Date(s.getTime()+1);
      const last=new Date(en.getTime()-1); /* 종료 경계 직전 = 마지막 포함일 */
      let d=new Date(s.getFullYear(),s.getMonth(),s.getDate());
      const stop=new Date(last.getFullYear(),last.getMonth(),last.getDate());
      let guard=0;
      while(d<=stop&&guard++<62){
        if(d.getFullYear()===y&&d.getMonth()===m)(byDay[d.getDate()]=byDay[d.getDate()]||[]).push(e);
        d.setDate(d.getDate()+1);
      }
    });
    const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
    const today=new Date();
    let cal='<div class="mnav"><button class="hbtn" id="mprev">‹</button><b>'+y+"."+p2(m+1)+'</b><button class="hbtn" id="mnext">›</button></div>';
    cal+='<div class="mgrid">'+["일","월","화","수","목","금","토"].map(d=>'<div class="mh">'+d+'</div>').join("");
    for(let i=0;i<first;i++)cal+='<div class="md off"></div>';
    for(let d=1;d<=days;d++){
      const isT=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
      const list=(byDay[d]||[]);
      cal+='<div class="md'+(isT?" today":"")+'"><span class="dn2">'+d+'</span>'
        +list.slice(0,2).map(e=>{const c=evColor(e);return '<span class="me" style="background:'+hexA(c,.17)+';box-shadow:inset 2px 0 0 '+c+'">'+esc((e.summary||"").slice(0,7))+'</span>';}).join("")
        +(list.length>2?'<span class="me more">+'+(list.length-2)+'</span>':"")+'</div>';
    }
    cal+='</div>';
    /* 다가오는 일정 */
    const up=evs.filter(e=>evDate(e)>=today).slice(0,8);
    cal+='<div class="sec-label" style="margin-top:16px">다가오는 일정</div>'
      +(up.length?up.map(e=>{const dd=evDate(e);
        return '<div class="ev"><span class="d">'+(dd.getMonth()+1)+"/"+dd.getDate()+" "+DAYS[dd.getDay()]+'</span><span class="edot" style="background:'+evColor(e)+'"></span><span class="t">'+esc(e.summary||"")+'</span>'
        +(e.start.dateTime?'<span class="tm">'+p2(dd.getHours())+":"+p2(dd.getMinutes())+'</span>':"")+'</div>';}).join("")
      :'<div class="w-empty">이번 달 남은 일정 없음</div>');
    det.innerHTML=cal;
    det.querySelector("#mprev").onclick=()=>{calMonth=new Date(y,m-1,1);draw();};
    det.querySelector("#mnext").onclick=()=>{calMonth=new Date(y,m+1,1);draw();};
  }
  calMonth=new Date(); draw();
}

let Q={amt:null,desc:"",cat:null,type:"지출"};
function qParse(s){
  s=s.trim(); if(!s)return null;
  let type=/수입/.test(s)?"수입":"지출";
  s=s.replace(/수입|지출/g,"").trim();
  const ms=[...s.matchAll(/(\d[\d,]*(?:\.\d+)?)\s*(만)?\s*원?/g)];
  if(!ms.length)return null;
  const m=ms[ms.length-1];
  let amt=parseFloat(m[1].replace(/,/g,""));
  if(m[2])amt*=10000;
  const desc=(s.slice(0,m.index)+s.slice(m.index+m[0].length)).replace(/\s+/g," ").trim()||"기타";
  const cat=type==="지출"?guessTarget(desc):null;
  return {amt:Math.round(amt),desc,cat,type};
}

  pv.innerHTML='<span class="amt">'+p.amt.toLocaleString()+'원</span><span>'+esc(p.desc)+'</span>'
    +'<span class="tsel"><button data-t="지출" class="'+(p.type==="지출"?"on":"")+'">지출</button><button data-t="수입" class="'+(p.type==="수입"?"on":"")+'">수입</button></span>'
    +(p.type==="지출"?'<select id="q-cat">'+(p.cat?"":'<option selected value="">항목 선택</option>')+catOptions(p.cat)+'</select>':"");
  pv.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{Q.type=b.dataset.t;$("q-in").dispatchEvent(new Event("input"));const v=$("q-in").value;});
});
$("q-in").addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("q-save").disabled)qSave();});
$("q-save").onclick=qSave;
async function qSave(){
  const p=qParse($("q-in").value); if(!p)return;
  if(Q.type)p.type=Q.type;
  const sel=$("q-cat"); if(sel&&sel.value)p.cat=sel.value;
  if(p.type==="지출"&&!p.cat){toast("항목을 골라주세요");return;}
  if(!gtoken()){toast("구글 데이터 연결이 필요해요");return;}
  $("q-save").disabled=true;
  try{
    const now=new Date();
    const ds=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    /* 1) 입력로그 append (탭 없으면 생성 후 재시도) */
    const row=[[ds,p.desc,p.amt,p.cat||"",p.type]];
    const appendURL="https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+"/values/"+encodeURIComponent("입력로그!A:E")+":append?valueInputOption=USER_ENTERED";
    try{
      await gfetch(appendURL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({values:row})});
    }catch(e){
      if(String(e.message).indexOf("api-400")>=0){
        await gfetch("https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+":batchUpdate",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({requests:[{addSheet:{properties:{title:"입력로그"}}}]})});
        await gfetch(appendURL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({values:[["날짜","내용","금액","카테고리","구분"],...row]})});
      }else throw e;
    }
    /* 2) 지출이면 Details 카테고리 셀 가산 */
    if(p.type==="지출"){
      if(!SHEET)await loadSheet();
      const r=SHEET.targetRows[p.cat];
      if(r!==undefined){
        const a1="Details!"+colA1(SHEET.mc)+(r+1);
        /* 수식이면 "+금액"을 이어붙여 내역 보존, 숫자면 합산, 비었으면 새로 */
        const cur=await gfetch("https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+"/values/"+encodeURIComponent(a1)+"?valueRenderOption=FORMULA");
        const raw=cur.values&&cur.values[0]?cur.values[0][0]:"";
        let nv;
        if(typeof raw==="string"&&raw.trim().startsWith("="))nv=raw+"+"+p.amt;
        else if(typeof raw==="number")nv=raw+p.amt;
        else if(raw!==""&&!isNaN(+raw))nv=(+raw)+p.amt;
        else nv=p.amt;
        await gfetch("https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+"/values/"+encodeURIComponent(a1)+"?valueInputOption=USER_ENTERED",
          {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({values:[[nv]]})});
      }
    }
    toast((p.type==="지출"?"지출":"수입")+" "+p.amt.toLocaleString()+"원 기록됨");
    $("q-in").value=""; $("q-prev").classList.add("hidden"); 
    dashLoaded=0; loadSheet().catch(()=>{});
  }catch(e){ toast("저장 실패: "+e.message); }
  $("q-save").disabled=false;
}

</script>
